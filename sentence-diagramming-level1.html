<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentence Diagramming — Levels 1–12</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
.card{background:#fdf6e3;border-radius:20px;padding:22px 28px;max-width:800px;width:100%;box-shadow:0 24px 80px rgba(0,0,0,.35)}

/* LEVEL TABS */
.tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.tab{flex:1;min-width:100px;padding:8px 4px;border:none;border-radius:10px;font-family:sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;background:#ecf0f1;color:#95a5a6;text-align:center;line-height:1.3}
.tab:hover{background:#000000;color:#555}
.tab.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;box-shadow:0 4px 14px rgba(118,75,162,.4)}
.tab.done{background:#27ae60;color:#fff}
.tab .tnum{font-size:16px;display:block}

/* SCORE */
.scorebar{display:flex;justify-content:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.pill{background:#fff;border-radius:20px;padding:5px 14px;font-size:13px;font-family:sans-serif;color:#2c3e50;box-shadow:0 2px 8px rgba(0,0,0,.08);font-weight:700}

/* INSTRUCTION */
.instr{background:#fff;border-left:4px solid #764ba2;border-radius:0 8px 8px 0;padding:11px 15px;margin-bottom:16px;font-size:14px;line-height:1.65;color:#2c3e50}
.instr b{color:#2c3e50}
.sw{color:#2980b9;font-weight:700}.vw{color:#c0392b;font-weight:700}
.aw{color:#8e44ad;font-weight:700}.pw{color:#d35400;font-weight:700}
.ow{color:#16a085;font-weight:700}.cw{color:#27ae60;font-weight:700}
.iw{color:#f39c12;font-weight:700}

/* SENTENCE BOX */
.sbox{text-align:center;font-size:21px;font-style:italic;color:#2c3e50;margin-bottom:14px;padding:12px;background:#fff;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.sbox small{display:block;font-size:12px;font-style:normal;font-family:sans-serif;color:#bdc3c7;margin-top:5px}
.diff-badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-family:sans-serif;font-weight:700;margin-left:6px;vertical-align:middle;letter-spacing:.3px}
.diff-easy{background:#d5f5e3;color:#1e8449}
.diff-medium{background:#fdebd0;color:#b7770d}
.diff-hard{background:#fadbd8;color:#c0392b}

/* DIFFICULTY FILTER */
.dfilter{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.dflabel{font-family:sans-serif;font-size:12px;color:#95a5a6;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.dfbtn{padding:5px 16px;border-radius:20px;border:2px solid transparent;font-size:12px;font-family:sans-serif;font-weight:700;cursor:pointer;opacity:.32;transition:all .2s;outline:none}
.dfbtn.dfactive{opacity:1;box-shadow:0 2px 10px rgba(0,0,0,.13)}
.dfbtn.dfactive:hover{transform:translateY(-1px)}
.dfbtn[data-d=easy]{background:#d5f5e3;color:#1e8449;border-color:#a9dfbf}
.dfbtn[data-d=medium]{background:#fdebd0;color:#b7770d;border-color:#f5cba7}
.dfbtn[data-d=hard]{background:#fadbd8;color:#c0392b;border-color:#f1948a}

/* WORD BANK */
.wordbank{display:flex;justify-content:center;gap:12px;margin-bottom:16px;min-height:52px;align-items:center;flex-wrap:wrap}
.chip{background:#fff;border:2.5px solid #bdc3c7;border-radius:10px;padding:9px 20px;font-size:18px;font-family:Georgia,serif;cursor:grab;user-select:none;transition:all .15s;box-shadow:0 3px 8px rgba(0,0,0,.1)}
.chip:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.15);border-color:#764ba2}
.chip.sel{border-color:#764ba2;background:#f8f4ff;box-shadow:0 0 0 3px rgba(118,75,162,.25)}
.chip.drag{opacity:.35}.chip.gone{visibility:hidden}

/* DIAGRAM */
.dwrap{background:#fff;border-radius:12px;padding:10px;box-shadow:0 2px 10px rgba(0,0,0,.07);margin-bottom:16px}
.dinner{position:relative;aspect-ratio:700/260}
.dinner svg{position:absolute;inset:0;width:100%;height:100%}
.zone{position:absolute;border-radius:8px;cursor:pointer;transition:background .15s;border:2px dashed transparent}
.zone.over{background:rgba(118,75,162,.1);border-color:rgba(118,75,162,.4)}
.zone.shake{animation:shake .35s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* CONTROLS */
.controls{display:flex;justify-content:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
button{font-family:sans-serif;font-size:13px;font-weight:700;padding:8px 16px;border-radius:8px;border:none;cursor:pointer;transition:all .15s}
button:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.08);box-shadow:0 4px 12px rgba(0,0,0,.15)}
button:disabled{opacity:.35;cursor:not-allowed}
#bHint{background:#f39c12;color:#fff}
#bShow{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
#bReset{background:#ecf0f1;color:#555}
#bNext{background:#27ae60;color:#fff}

/* FEEDBACK */
.fb{text-align:center;min-height:22px;font-size:14px;font-style:italic;color:#7f8c8d;margin-bottom:10px}
.fb.ok{color:#27ae60}.fb.err{color:#c0392b}.fb.hint{color:#8e44ad}

/* PROGRESS */
.prow{display:flex;justify-content:space-between;align-items:center;font-family:sans-serif;font-size:12px;color:#bdc3c7}
.dots{display:flex;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;background:#000000;transition:background .3s}
.dot.done{background:#27ae60}.dot.cur{background:#764ba2}

/* ACHIEVEMENT */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:1000}
.overlay[hidden]{display:none}
.acard{background:#fff;border-radius:24px;padding:40px;text-align:center;max-width:320px;box-shadow:0 24px 80px rgba(0,0,0,.4);animation:popIn .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.aicon{font-size:60px;display:block;margin-bottom:10px;animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.aname{font-size:20px;font-weight:700;color:#2c3e50;margin-bottom:6px}
.adesc{font-size:13px;color:#7f8c8d;font-style:italic;margin-bottom:20px;line-height:1.5}
.acard button{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:14px;padding:10px 28px;border-radius:10px}

/* MISC */
.pop{position:fixed;font-family:sans-serif;font-size:22px;font-weight:700;color:#27ae60;pointer-events:none;z-index:1002;animation:popUp 1s ease forwards}
@keyframes popUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-65px)}}
#cnv{position:fixed;inset:0;pointer-events:none;z-index:999}
</style>
</head>
<body>
<a href="index.html" style="display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;padding:7px 16px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:100px;color:#fff;font-family:sans-serif;font-size:13px;font-weight:700;text-decoration:none;transition:background .2s" onmouseover="this.style.background='rgba(255,255,255,.28)'" onmouseout="this.style.background='rgba(255,255,255,.18)'">← Learning Hub</a>
<canvas id="cnv"></canvas>
<div class="card">

  <!-- LEVEL TABS -->
  <div class="tabs" role="tablist">
    <button class="tab active" role="tab" aria-selected="true"  onclick="switchLevel(1)" id="tab1"><span class="tnum">1</span>Main Line</button>
    <button class="tab"        role="tab" aria-selected="false" onclick="switchLevel(2)" id="tab2"><span class="tnum">2</span>Modifiers</button>
    <button class="tab"        role="tab" aria-selected="false" onclick="switchLevel(3)" id="tab3"><span class="tnum">3</span>Prep Phrases</button>
    <button class="tab"        role="tab" aria-selected="false" onclick="switchLevel(4)" id="tab4"><span class="tnum">4</span>Conjunctions</button>
    <button class="tab"        role="tab" aria-selected="false" onclick="switchLevel(5)" id="tab5"><span class="tnum">5</span>Interjections</button>
    <button class="tab"        role="tab" aria-selected="false" onclick="switchLevel(6)" id="tab6"><span class="tnum">6</span>Direct Objects</button>
    <button class="tab"        role="tab" aria-selected="false" onclick="switchLevel(7)" id="tab7"><span class="tnum">7</span>Indirect Obj</button>
    <button class="tab"        role="tab" aria-selected="false" onclick="switchLevel(8)" id="tab8"><span class="tnum">8</span>Linking Verbs</button>
    <button class="tab"        role="tab" aria-selected="false" onclick="switchLevel(9)" id="tab9"><span class="tnum">9</span>Adj. Clauses</button>
    <button class="tab"        role="tab" aria-selected="false" onclick="switchLevel(10)" id="tab10"><span class="tnum">10</span>Noun Clauses</button>
    <button class="tab"        role="tab" aria-selected="false" onclick="switchLevel(11)" id="tab11"><span class="tnum">11</span>Adverb Clauses</button>
    <button class="tab"        role="tab" aria-selected="false" onclick="switchLevel(12)" id="tab12"><span class="tnum">12</span>Verbals</button>
  </div>

  <!-- DIFFICULTY FILTER -->
  <div class="dfilter" role="group" aria-label="Filter by difficulty">
    <span class="dflabel">Show:</span>
    <button class="dfbtn dfactive" data-d="easy"   id="dfbtn-easy"   onclick="toggleDiff('easy')"   aria-pressed="true" >🟢 Easy</button>
    <button class="dfbtn dfactive" data-d="medium" id="dfbtn-medium" onclick="toggleDiff('medium')" aria-pressed="true" >🟡 Medium</button>
    <button class="dfbtn dfactive" data-d="hard"   id="dfbtn-hard"   onclick="toggleDiff('hard')"   aria-pressed="true" >🔴 Hard</button>
  </div>

  <!-- SCORE -->
  <div class="scorebar">
    <div class="pill">⭐ <span id="pts">0</span> pts</div>
    <div class="pill">🔥 <span id="str">0</span> streak</div>
    <div class="pill" id="donePill">✅ <span id="don">0</span> done</div>
  </div>

  <!-- INSTRUCTION -->
  <div class="instr" id="instr"></div>

  <!-- SENTENCE -->
  <div class="sbox" id="sbox">— — —<small>Loading…</small></div>

  <!-- WORD BANK -->
  <div class="wordbank" id="wbank" aria-label="Word bank — drag words onto the diagram"></div>

  <!-- DIAGRAM -->
  <div class="dwrap" role="img" aria-label="Sentence diagram area">
    <div class="dinner" id="dinner">
      <svg id="dsvg" viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <button id="bHint"  onclick="doHint()"  aria-label="Get a hint">💡 Hint</button>
    <button id="bShow"  onclick="doShowMe()" aria-label="Show the correct diagram">▶ Show Me</button>
    <button id="bReset" onclick="doReset()"  aria-label="Reset current sentence">↺ Reset</button>
    <button id="bNext"  onclick="doNext()"   aria-label="Next sentence" disabled>Next →</button>
  </div>

  <div class="fb" id="fb" role="status" aria-live="polite"></div>

  <div class="prow">
    <span>Sentence <span id="cnum">1</span> of <span id="ctot">10</span></span>
    <div class="dots" id="dots" role="list" aria-label="Progress"></div>
    <span id="htally">Hints: 0</span>
  </div>
</div>

<!-- ACHIEVEMENT -->
<div class="overlay" id="achOverlay" hidden role="dialog" aria-modal="true" aria-labelledby="aName">
  <div class="acard">
    <span class="aicon" id="aIcon" aria-hidden="true">🏆</span>
    <div class="aname" id="aName"></div>
    <div class="adesc" id="aDesc"></div>
    <button onclick="document.getElementById('achOverlay').hidden=true" aria-label="Close achievement">Keep Going!</button>
  </div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════════════════════
const DATA = {
  // ══ LEVEL 1 · Main Line ═══════════════════════════════════════════════
  // Medium trick: subject is NOT in the normal first position (inverted sentences)
  // Hard trick:   subject is a gerund/abstract noun; a word looks like it could be the other part
  1: [
    // EASY — subject comes first, verb comes second, nothing ambiguous
    {difficulty:'easy',  display:'Cats meow.',          w:{subject:'Cats',     verb:'meow'}},
    {difficulty:'easy',  display:'Birds sing.',          w:{subject:'Birds',    verb:'sing'}},
    {difficulty:'easy',  display:'Dogs bark.',           w:{subject:'Dogs',     verb:'bark'}},
    {difficulty:'easy',  display:'Fish swim.',           w:{subject:'Fish',     verb:'swim'}},
    {difficulty:'easy',  display:'Stars shine.',         w:{subject:'Stars',    verb:'shine'}},
    {difficulty:'easy',  display:'Thunder roars.',       w:{subject:'Thunder',  verb:'roars'}},
    {difficulty:'easy',  display:'Flowers bloom.',       w:{subject:'Flowers',  verb:'bloom'}},
    {difficulty:'easy',  display:'Rivers flow.',         w:{subject:'Rivers',   verb:'flow'}},
    {difficulty:'easy',  display:'Babies sleep.',        w:{subject:'Babies',   verb:'sleep'}},
    {difficulty:'easy',  display:'Children laugh.',      w:{subject:'Children', verb:'laugh'}},
    // MEDIUM — inverted word order; subject follows the verb in the sentence
    {difficulty:'medium',display:'Down the hill rolled the boulder.',  w:{subject:'boulder',   verb:'rolled'},  tip:'Inverted! Ask: what rolled?'},
    {difficulty:'medium',display:'Here comes the sunrise.',           w:{subject:'sunrise',   verb:'comes'},   tip:'"Here" is an adverb, not the subject.'},
    {difficulty:'medium',display:'There stood an ancient oak.',       w:{subject:'oak',       verb:'stood'},   tip:'"There" is an adverb. What stood?'},
    {difficulty:'medium',display:'Into the clearing leaped the deer.',w:{subject:'deer',      verb:'leaped'},  tip:'Prepositional opener — find who acted.'},
    {difficulty:'medium',display:'Away rushed the frightened crowd.', w:{subject:'crowd',     verb:'rushed'},  tip:'"Away" is an adverb. Who rushed?'},
    // HARD — gerund subject or a word that moonlights as a noun
    {difficulty:'hard',  display:'Swimming fatigues the muscles.',    w:{subject:'Swimming',  verb:'fatigues'},tip:'"Swimming" is a gerund acting as subject. "Fatigues" is a verb (not the plural noun).'},
    {difficulty:'hard',  display:'Running builds endurance.',         w:{subject:'Running',   verb:'builds'},  tip:'"Running" is a gerund subject — it performs the action of "builds".'},
    {difficulty:'hard',  display:'Silence speaks volumes.',           w:{subject:'Silence',   verb:'speaks'},  tip:'Abstract nouns can be subjects. "Speaks" is a verb here, not a person.'},
  ],
  // ══ LEVEL 2 · Modifiers ═══════════════════════════════════════════════
  // Medium trick: the modifier word (adj or adv) can ALSO be the other type in different sentences
  // Hard trick:   both a modifier word AND another content word have dual roles
  2: [
    // EASY — colour/size adjectives + clearly adverbial -ly adverbs
    {difficulty:'easy',  display:'Tiny birds sang sweetly.',     w:{adj:'Tiny',   subj:'birds',  verb:'sang',     adv:'sweetly'}},
    {difficulty:'easy',  display:'Yellow ducks quacked loudly.', w:{adj:'Yellow', subj:'ducks',  verb:'quacked',  adv:'loudly'}},
    {difficulty:'easy',  display:'Old dogs bark fiercely.',      w:{adj:'Old',    subj:'dogs',   verb:'bark',     adv:'fiercely'}},
    {difficulty:'easy',  display:'Red fish swim quickly.',       w:{adj:'Red',    subj:'fish',   verb:'swim',     adv:'quickly'}},
    {difficulty:'easy',  display:'Small cats purr softly.',      w:{adj:'Small',  subj:'cats',   verb:'purr',     adv:'softly'}},
    {difficulty:'easy',  display:'Bright stars shine clearly.',  w:{adj:'Bright', subj:'stars',  verb:'shine',    adv:'clearly'}},
    {difficulty:'easy',  display:'Happy babies slept soundly.',  w:{adj:'Happy',  subj:'babies', verb:'slept',    adv:'soundly'}},
    {difficulty:'easy',  display:'Gentle rain falls quietly.',   w:{adj:'Gentle', subj:'rain',   verb:'falls',    adv:'quietly'}},
    {difficulty:'easy',  display:'Tall trees swayed gently.',    w:{adj:'Tall',   subj:'trees',  verb:'swayed',   adv:'gently'}},
    {difficulty:'easy',  display:'Dark clouds gathered fast.',   w:{adj:'Dark',   subj:'clouds', verb:'gathered', adv:'fast'}},
    // MEDIUM — adj is a word that ALSO works as an adverb (Early, Hard, High, Long, Fast)
    {difficulty:'medium',display:'Early birds sing cheerfully.',  w:{adj:'Early', subj:'birds',  verb:'sing',  adv:'cheerfully'}, tip:'"Early" modifies "birds" (adj), not "sing" (that would be an adverb).'},
    {difficulty:'medium',display:'Hard workers succeed daily.',   w:{adj:'Hard',  subj:'workers',verb:'succeed',adv:'daily'},     tip:'"Hard" describes the workers (adj), not how they succeed.'},
    {difficulty:'medium',display:'High clouds drift endlessly.',  w:{adj:'High',  subj:'clouds', verb:'drift', adv:'endlessly'},  tip:'"High" is an adj here — it answers "what kind of clouds?"'},
    {difficulty:'medium',display:'Long trains run nightly.',      w:{adj:'Long',  subj:'trains', verb:'run',   adv:'nightly'},    tip:'"Long" describes the trains (adj); "nightly" tells when (adv).'},
    {difficulty:'medium',display:'Fast runners tire suddenly.',   w:{adj:'Fast',  subj:'runners',verb:'tire',  adv:'suddenly'},   tip:'"Fast" = adj here (it tells what kind of runners).'},
    // HARD — BOTH a modifier and another word have dual possible roles
    {difficulty:'hard',  display:'Deep rivers run silently.',     w:{adj:'Deep',  subj:'rivers', verb:'run',   adv:'silently'},   tip:'"Deep" is adj (modifies rivers). "Silently" is adv (modifies run). Don\'t confuse them!'},
    {difficulty:'hard',  display:'Still waters flow secretly.',   w:{adj:'Still', subj:'waters', verb:'flow',  adv:'secretly'},   tip:'"Still" can be adv/conj/adj — here it modifies "waters" (adj).'},
    {difficulty:'hard',  display:'Late trains arrive unexpectedly.',w:{adj:'Late', subj:'trains',verb:'arrive',adv:'unexpectedly'},tip:'"Late" = adj (which trains?). Don\'t put it in the adverb slot.'},
  ],
  // ══ LEVEL 3 · Prepositional Phrases ══════════════════════════════════
  // Medium trick: prepositions that also function as other parts (over, through, past)
  // Hard trick:   the "object" word looks like it could be the subject or verb
  3: [
    // EASY — simple, unambiguous prepositions
    {difficulty:'easy',  display:'Cats sit on mats.',          w:{subj:'Cats',     verb:'sit',    prep:'on',       obj:'mats'}},
    {difficulty:'easy',  display:'Birds nest in trees.',       w:{subj:'Birds',    verb:'nest',   prep:'in',       obj:'trees'}},
    {difficulty:'easy',  display:'Fish swim in rivers.',       w:{subj:'Fish',     verb:'swim',   prep:'in',       obj:'rivers'}},
    {difficulty:'easy',  display:'Dogs sleep on porches.',     w:{subj:'Dogs',     verb:'sleep',  prep:'on',       obj:'porches'}},
    {difficulty:'easy',  display:'Stars shine in skies.',      w:{subj:'Stars',    verb:'shine',  prep:'in',       obj:'skies'}},
    {difficulty:'easy',  display:'We walked through forests.', w:{subj:'We',       verb:'walked', prep:'through',  obj:'forests'}},
    {difficulty:'easy',  display:'Children played in parks.',  w:{subj:'Children', verb:'played', prep:'in',       obj:'parks'}},
    {difficulty:'easy',  display:'Rain falls from clouds.',    w:{subj:'Rain',     verb:'falls',  prep:'from',     obj:'clouds'}},
    {difficulty:'easy',  display:'Wind blows across fields.',  w:{subj:'Wind',     verb:'blows',  prep:'across',   obj:'fields'}},
    {difficulty:'easy',  display:'Boats sail on oceans.',      w:{subj:'Boats',    verb:'sail',   prep:'on',       obj:'oceans'}},
    // MEDIUM — less obvious prepositions; "of", "over"(=about), "past", "despite"
    {difficulty:'medium',display:'Students dream of success.',   w:{subj:'Students', verb:'dream',  prep:'of',      obj:'success'},  tip:'"of" is a preposition leading the phrase — "success" is its object.'},
    {difficulty:'medium',display:'Experts argue over details.',  w:{subj:'Experts',  verb:'argue',  prep:'over',    obj:'details'},  tip:'"over" here means "about" — it\'s still a preposition.'},
    {difficulty:'medium',display:'Runners race past markers.',   w:{subj:'Runners',  verb:'race',   prep:'past',    obj:'markers'},  tip:'"past" is a preposition here, not an adjective.'},
    {difficulty:'medium',display:'Success comes despite setbacks.',w:{subj:'Success', verb:'comes', prep:'despite', obj:'setbacks'}, tip:'"despite" is a preposition — it introduces its object "setbacks".'},
    {difficulty:'medium',display:'Ideas travel between people.',  w:{subj:'Ideas',    verb:'travel', prep:'between', obj:'people'},   tip:'"between" must have an object (people), not stand alone.'},
    // HARD — abstract nouns as subject AND object; subject could look like verb
    {difficulty:'hard',  display:'Fear hides beneath courage.',  w:{subj:'Fear',     verb:'hides',  prep:'beneath', obj:'courage'},  tip:'Both "Fear" and "courage" are abstract nouns. Which one is performing the action?'},
    {difficulty:'hard',  display:'Change begins with choice.',   w:{subj:'Change',   verb:'begins', prep:'with',    obj:'choice'},   tip:'"Change" is the subject (noun), not a verb here. "choice" is the object.'},
    {difficulty:'hard',  display:'Order emerges from chaos.',    w:{subj:'Order',    verb:'emerges',prep:'from',    obj:'chaos'},    tip:'"Order" and "chaos" are both nouns. Which one is doing the emerging?'},
  ],
  // ══ LEVEL 4 · Coordinating Conjunctions ══════════════════════════════
  // Medium trick: conjunctions other than "and" (but, yet, nor)
  // Hard trick:   abstract nouns in compound position where both look like verbs
  4: [
    // EASY — "and" / "or" only, concrete nouns
    {difficulty:'easy',  type:'cs',display:'Dogs and cats play.',      w:{s1:'Dogs',    conj:'and',s2:'cats',    verb:'play'}},
    {difficulty:'easy',  type:'cs',display:'Birds and fish live.',     w:{s1:'Birds',   conj:'and',s2:'fish',    verb:'live'}},
    {difficulty:'easy',  type:'cs',display:'Boys and girls sang.',     w:{s1:'Boys',    conj:'and',s2:'girls',   verb:'sang'}},
    {difficulty:'easy',  type:'cs',display:'Rain or snow falls.',      w:{s1:'Rain',    conj:'or', s2:'snow',    verb:'falls'}},
    {difficulty:'easy',  type:'cs',display:'Cats and dogs sleep.',     w:{s1:'Cats',    conj:'and',s2:'dogs',    verb:'sleep'}},
    {difficulty:'easy',  type:'cv',display:'Birds sing and fly.',      w:{subj:'Birds',    v1:'sing', conj:'and',v2:'fly'}},
    {difficulty:'easy',  type:'cv',display:'Dogs bark and run.',       w:{subj:'Dogs',     v1:'bark', conj:'and',v2:'run'}},
    {difficulty:'easy',  type:'cv',display:'Children laugh and play.', w:{subj:'Children', v1:'laugh',conj:'and',v2:'play'}},
    {difficulty:'easy',  type:'cv',display:'Fish swim and jump.',      w:{subj:'Fish',     v1:'swim', conj:'and',v2:'jump'}},

// ═══════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════
const S = {
  lv:1, idx:0, score:0, streak:0, done:0,
  slots:[], placed:{},
  hintThis:false, noHints:true, hintTotal:0,
  selected:null, busy:false,
  badges:new Set(), levelDone:new Set(),
  history:{},   // per-level sentence index history for rotation
  filterDiff: new Set(['easy','medium','hard']),
  filtIdx: 0,   // index within the currently-filtered sentence list
};

// Returns filtered sentence list for current level
function getFiltered(){
  return DATA[S.lv].filter(s=>S.filterDiff.has(s.difficulty||'easy'));
}

// Toggle a difficulty tier on/off; always keep at least one active
function toggleDiff(d){
  const wasActive = S.filterDiff.has(d);
  if(wasActive && S.filterDiff.size===1) return; // never allow empty filter
  wasActive ? S.filterDiff.delete(d) : S.filterDiff.add(d);
  ['easy','medium','hard'].forEach(x=>{
    const btn = document.getElementById('dfbtn-'+x);
    if(btn){
      btn.classList.toggle('dfactive', S.filterDiff.has(x));
      btn.setAttribute('aria-pressed', S.filterDiff.has(x));
    }
  });
  S.filtIdx = 0;
  loadSentence();
}

// ═══════════════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════════════
window.onload = () => { for(let i=1;i<=12;i++) S.history[i]=0; switchLevel(1); };

function switchLevel(n){
  S.lv=n; S.filtIdx=0;
  document.querySelectorAll('.tab').forEach((t,i)=>{
    const lv=i+1;
    t.classList.remove('active');
    if(lv===n) t.classList.add('active');
    t.setAttribute('aria-selected', lv===n ? 'true':'false');
  });
  document.getElementById('donePill').querySelector('span').id='don';
  loadSentence();
}

function loadSentence(){
  const filtered = getFiltered();
  if(!filtered.length){
    document.getElementById('sbox').innerHTML=
      `<em>No sentences match the selected difficulty filters.</em><small>Toggle at least one filter above.</small>`;
    document.getElementById('wbank').innerHTML='';
    document.getElementById('dsvg').innerHTML='';
    document.getElementById('dinner').querySelectorAll('.zone').forEach(z=>z.remove());
    buildDots();
    return;
  }
  S.filtIdx = S.filtIdx % filtered.length;
  const sent = filtered[S.filtIdx];
  const cfg  = CFG[S.lv];

  S.placed={}; S.hintThis=false; S.selected=null; S.busy=false;

  // instruction
  document.getElementById('instr').innerHTML = cfg.instr;

  // sentence display with difficulty badge
  const diff = sent.difficulty || 'easy';
  const diffEmoji = {easy:'🟢', medium:'🟡', hard:'🔴'};
  const diffLabel = {easy:'Easy', medium:'Medium', hard:'Hard'};
  document.getElementById('sbox').innerHTML =
    `<em>"${sent.display}"</em><span class="diff-badge diff-${diff}">${diffEmoji[diff]} ${diffLabel[diff]}</span><small>Drag or click each word onto the correct part of the diagram</small>`;

  // SVG
  const svgEl = document.getElementById('dsvg');
  svgEl.innerHTML = cfg.svgFn(sent.w);

  // slots
  S.slots = cfg.slotsFn(sent.w);
  S.slots.forEach(sl => S.placed[sl.role]=false);

  // zones
  const dinner = document.getElementById('dinner');
  dinner.querySelectorAll('.zone').forEach(z=>z.remove());
  S.slots.forEach((sl,i)=>{
    const z = document.createElement('div');
    z.className='zone'; z.id='zone'+i;
    z.style.cssText = sl.zone;
    z.setAttribute('role','button');
    z.setAttribute('aria-label',`Drop zone: ${sl.desc}`);
    z.addEventListener('click',  ()=>zoneClick(i));
    z.addEventListener('dragover', e=>{e.preventDefault(); if(!S.placed[sl.role]) hlZone(sl.hlId,true,z);});
    z.addEventListener('dragleave',()=>hlZone(sl.hlId,false,z));
    z.addEventListener('drop',   e=>{ e.preventDefault(); hlZone(sl.hlId,false,z); dropOnZone(e,i); });
    dinner.appendChild(z);
  });

  // word bank
  const bank = document.getElementById('wbank');
  bank.innerHTML='';
  const shuffled = [...S.slots].sort(()=>Math.random()-.5);
  shuffled.forEach(sl=>{
    const c=document.createElement('div');
    c.className='chip'; c.textContent=sl.word;
    c.id='chip-'+sl.role; c.dataset.role=sl.role; c.draggable=true;
    c.setAttribute('tabindex','0');
    c.setAttribute('aria-label',`Word: ${sl.word}`);
    c.addEventListener('click',()=>chipClick(sl.role));
    c.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' ') chipClick(sl.role); });
    c.addEventListener('dragstart',e=>{
      S.selected=sl.role; c.classList.add('drag');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',sl.role);
    });
    c.addEventListener('dragend',()=>{ c.classList.remove('drag'); clearHls(); });
    bank.appendChild(c);
  });

  // UI reset
  fb('','');
  document.getElementById('bNext').disabled=true;
  const _filt = getFiltered();
  document.getElementById('cnum').textContent = S.filtIdx+1;
  document.getElementById('ctot').textContent = _filt.length;
  buildDots();
  updateBar();
}

function buildDots(){
  const el=document.getElementById('dots'); el.innerHTML='';
  const filt=getFiltered();
  filt.forEach((_,i)=>{
    const d=document.createElement('div');
    d.className='dot'+(i<S.filtIdx?' done':i===S.filtIdx?' cur':'');
    d.setAttribute('role','listitem');
    d.setAttribute('aria-label', i===S.filtIdx?'current':i<S.filtIdx?'complete':'upcoming');
    el.appendChild(d);
  });
}

// ═══════════════════════════════════════════════════════════════════════
// INTERACTION
// ═══════════════════════════════════════════════════════════════════════
function chipClick(role){
  if(S.placed[role]) return;
  if(S.selected===role){
    S.selected=null;
    document.getElementById('chip-'+role)?.classList.remove('sel');
  } else {
    S.slots.forEach(sl=>document.getElementById('chip-'+sl.role)?.classList.remove('sel'));
    S.selected=role;
    document.getElementById('chip-'+role)?.classList.add('sel');
    fb('Now click the correct part of the diagram.','hint');
  }
}

function zoneClick(i){
  if(!S.selected) return;
  const sl=S.slots[i];
  if(S.selected===sl.role) place(S.selected);
  else { shakeZone(i); fb(`Hmm — that word goes somewhere else. Try the <b>${S.slots.find(s=>s.role===S.selected)?.desc}</b> spot.`,'err'); }
}

function dropOnZone(e,i){
  const role=e.dataTransfer.getData('text/plain')||S.selected;
  if(!role) return;
  const sl=S.slots[i];
  S.selected=role;
  if(role===sl.role) place(role);
  else { shakeZone(i); fb('Not quite — that word belongs elsewhere.','err'); }
}

function hlZone(hlId,on,zEl){
  const el=document.getElementById(hlId);
  if(el) el.setAttribute('opacity',on?1:0);
  if(zEl) zEl.classList.toggle('over',on);
}

function clearHls(){
  S.slots.forEach(sl=>{
    const el=document.getElementById(sl.hlId);
    if(el) el.setAttribute('opacity',0);
    const z=document.getElementById('zone'+S.slots.indexOf(sl));
    if(z) z.classList.remove('over');
  });
}

function shakeZone(i){
  const z=document.getElementById('zone'+i);
  if(!z) return;
  z.classList.remove('shake'); void z.offsetWidth; z.classList.add('shake');
  setTimeout(()=>z.classList.remove('shake'),400);
}

// ═══════════════════════════════════════════════════════════════════════
// PLACE WORD
// ═══════════════════════════════════════════════════════════════════════
function place(role){
  if(S.placed[role]||S.busy) return;
  const sl=S.slots.find(s=>s.role===role);
  if(!sl) return;
  S.placed[role]=true;
  S.selected=null;
  S.slots.forEach(s=>document.getElementById('chip-'+s.role)?.classList.remove('sel'));
  document.getElementById('chip-'+role)?.classList.add('gone');

  const el=document.getElementById(sl.svgId);
  if(el){ el.textContent=sl.word; fadeIn(sl.svgId,350); }

  addScore(10); scorePop('+10');

  const msgs = {
    subject:['Subject on the left — perfect!','Exactly! The subject tells us who or what.','Yes — subjects belong left of the divider.'],
    verb:['Verb on the right — great!','Right! The verb shows the action.','The predicate goes right of the divider!'],
    subj:['Subject placed correctly!','Exactly — the subject goes on the left.','Perfect subject placement!'],
    adj:['Adjective below the noun — great!','Adjectives hang on a diagonal below what they describe.','Yes — adjectives describe nouns!'],
    adv:['Adverb below the verb — nice!','Adverbs modify verbs and hang below them.','Yes — adverbs describe how the action happens!'],
    prep:['Preposition on the diagonal — correct!','The preposition sits on the slanted line.','Right — prepositions lead the phrase!'],
    obj:['Object on the stub — perfect!','The object of the preposition sits on the horizontal.','Exactly — the object completes the phrase!'],
    s1:['First subject placed!','Great — subjects share a parallel structure.','Yes, first subject goes on the upper line!'],
    s2:['Second subject placed!','Perfect parallel structure!','Yes, second subject on the lower line!'],
    conj:['Conjunction on the dashed line — yes!','FANBOYS connect equal parts on the dashed bridge!','The conjunction joins the two parallel elements!'],
    v1:['First verb placed!','The first action goes on the upper line.','Yes — verb 1 in the compound predicate!'],
    v2:['Second verb placed!','The second action goes on the lower line.','Yes — verb 2 completes the compound predicate!'],
    intj:['Interjection above — floating freely!','Interjections stand apart from the sentence!','Yes — no connecting lines for interjections!'],
    dobj:['Direct object placed — perfect!','The direct object receives the action of the verb!','Yes — that\'s what gets acted upon!'],
    iobj:['Indirect object below the verb — excellent!','Right — the indirect object says to whom!','Yes — it hangs below the verb on its own horizontal!'],
    lverb:['Linking verb placed — great!','The linking verb connects subject to predicate!','Yes — linking verbs rename or describe the subject!'],
    pred:['Predicate placed after the back-slash — perfect!','The predicate renames or describes the subject!','Yes — right after the backward-slanting line!'],
    msubj:['Main clause subject placed — perfect!','Yes — that\'s the noun the adjective clause modifies!','Right — main subject goes on the upper baseline!'],
    mverb:['Main verb placed — great!','The main clause predicate is in!','Yes — the main verb goes right of the divider!'],
    rpron:['Relative pronoun on the clause baseline — yes!','who, which, or that — the clause connector is placed!','The relative pronoun links the clause to the noun above!'],
    cverb:['Clause verb placed — excellent!','The dependent clause action is in!','Yes — the clause verb completes the lower baseline!'],
    csubj:['Clause subject on the pedestal baseline — perfect!','The noun clause subject is placed!','Yes — it goes on the floating clause baseline above!'],
    sconj:['Subordinating conjunction on the diagonal — yes!','The connector is written on the dashed line — perfect!','Yes — sub.conj. goes right on the dashed diagonal!'],
    dsubj:['Clause subject on the lower baseline — perfect!','The adverb clause subject is in!','Yes — clause subject goes on the dependent baseline!'],
    dverb:['Clause verb on the lower baseline — excellent!','The adverb clause action is placed!','Yes — the clause verb completes the dependent baseline!'],
    ger:['Gerund on the mini-baseline — perfect!','The gerund is on its pedestal — acting as subject!','Yes — gerunds as subjects ride the pedestal above the main line!'],
  };
  const bank = msgs[role]||['Correct!','Right!','Well done!'];
  fb(bank[Math.floor(Math.random()*bank.length)],'ok');

  if(Object.values(S.placed).every(v=>v)) completeSentence();
}

// ═══════════════════════════════════════════════════════════════════════
// COMPLETE
// ═══════════════════════════════════════════════════════════════════════
function completeSentence(){
  S.busy=true; S.done++; S.streak++;
  // advance filtIdx; wraps around filtered set (not full DATA array)
  S.filtIdx=(S.filtIdx+1)%Math.max(1,getFiltered().length);
  addScore(S.hintThis?25:50);
  scorePop(S.hintThis?'+25':'+ 50 ✨');
  updateBar();
  setTimeout(()=>{
    fb("You're reading the map of that sentence like a pro! ⭐",'ok');
    launchConfetti();
    document.getElementById('bNext').disabled=false;
    checkBadges();
  },350);
}

function checkBadges(){
  const lv=S.lv;
  if(S.done>=10&&!S.badges.has('10')) {
    S.badges.add('10');
    setTimeout(()=>showAch('🌟','10 Diagrams!','You have built 10 sentence diagrams. You\'re a grammar architect!'),900);
  } else if(S.streak>=5&&!S.badges.has('s5')){
    S.badges.add('s5');
    setTimeout(()=>showAch('🔥','5-Streak!','Five correct in a row — you\'re on fire!'),900);
  } else if(S.lv===1&&S.done>=1&&!S.badges.has('bb')){
    S.badges.add('bb');
    setTimeout(()=>showAch('🏗️','Baseline Builder!','You built your first complete main line!'),900);
  } else if(S.lv>=9&&!S.badges.has('cc')){
    S.badges.add('cc');
    setTimeout(()=>showAch('⚖️','Clause Commander!','Dependent clauses mastered — you\'re a true grammar architect!'),900);
  } else if(S.lv>=12&&!S.badges.has('ga')){
    S.badges.add('ga');
    setTimeout(()=>showAch('🏆','Grammar Architect!','All 12 levels complete — you\'ve mastered the full Reed-Kellogg system!'),900);
  }
  if(S.noHints&&S.done%5===0&&!S.badges.has('nh'+S.done)){
    S.badges.add('nh'+S.done);
    setTimeout(()=>showAch('🎯','No Hints!',`${S.done} diagrams without a single hint — incredible!`),1800);
  }
}

// ═══════════════════════════════════════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════════════════════════════════════
function doNext(){
  S.filtIdx=(S.filtIdx+1)%Math.max(1,getFiltered().length);
  loadSentence();
}

function doHint(){
  S.hintThis=true; S.noHints=false; S.hintTotal++;
  document.getElementById('htally').textContent='Hints: '+S.hintTotal;
  const unplaced=S.slots.filter(sl=>!S.placed[sl.role]);
  if(!unplaced.length){ fb('All words are placed!','ok'); return; }
  // Show grammatical tip first (for medium/hard sentences), then highlight zone
  const filt=getFiltered();
  const sent=filt[S.filtIdx%Math.max(1,filt.length)];
  if(sent && sent.tip){
    fb(`💡 Grammar tip: ${sent.tip}`,'hint');
  } else {
    const sl=unplaced[0];
    const hlEl=document.getElementById(sl.hlId);
    if(hlEl){ hlEl.setAttribute('opacity',1); setTimeout(()=>hlEl.setAttribute('opacity',0),2200); }
    fb(`Hint: "${sl.word}" is the <b>${sl.desc}</b> — drop it in the highlighted zone.`,'hint');
    return;
  }
  // Also highlight the first unplaced zone
  const sl=unplaced[0];
  const hlEl=document.getElementById(sl.hlId);
  if(hlEl){ hlEl.setAttribute('opacity',1); setTimeout(()=>hlEl.setAttribute('opacity',0),2200); }
}

function doShowMe(){
  if(S.busy) return;
  S.busy=true; S.hintThis=true; S.noHints=false;
  document.querySelectorAll('.chip').forEach(c=>c.classList.add('gone'));
  fb('Watch the diagram build…','hint');
  const unplaced=S.slots.filter(sl=>!S.placed[sl.role]);
  unplaced.forEach((sl,i)=>{
    setTimeout(()=>{
      S.placed[sl.role]=true;
      const el=document.getElementById(sl.svgId);
      if(el){ el.textContent=sl.word; fadeIn(sl.svgId,400); }
      fb(`"${sl.word}" → ${sl.desc}`,'hint');
      if(i===unplaced.length-1) setTimeout(()=>{ S.busy=false; completeSentence(); },500);
    }, 400+(i*900));
  });
  if(!unplaced.length){ S.busy=false; completeSentence(); }
}

function doReset(){
  S.slots.forEach(sl=>{ S.placed[sl.role]=false; });
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('gone','sel','drag'));
  S.selected=null; S.busy=false;
  S.slots.forEach(sl=>{ const e=document.getElementById(sl.svgId); if(e){e.textContent='';e.setAttribute('opacity',0);} });
  fb('','');
  document.getElementById('bNext').disabled=true;
}

// ═══════════════════════════════════════════════════════════════════════
// SCORE / UI
// ═══════════════════════════════════════════════════════════════════════
function addScore(n){ S.score+=n; updateBar(); }
function updateBar(){
  document.getElementById('pts').textContent=S.score;
  document.getElementById('str').textContent=S.streak;
  document.getElementById('don').textContent=S.done;
}
function scorePop(t){
  const p=document.createElement('div');
  p.className='pop'; p.textContent=t;
  p.style.left=(window.innerWidth/2-40)+'px';
  p.style.top=(window.innerHeight*.38)+'px';
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),1000);
}
function fb(msg,cls){
  const el=document.getElementById('fb');
  el.innerHTML=msg; el.className='fb'+(cls?' '+cls:'');
}
function showAch(icon,name,desc){
  document.getElementById('aIcon').textContent=icon;
  document.getElementById('aName').textContent=name;
  document.getElementById('aDesc').textContent=desc;
  document.getElementById('achOverlay').hidden=false;
}

// ═══════════════════════════════════════════════════════════════════════
// CONFETTI
// ═══════════════════════════════════════════════════════════════════════
function launchConfetti(){
  const c=document.getElementById('cnv');
  const ctx=c.getContext('2d');
  c.width=window.innerWidth; c.height=window.innerHeight;
  const cols=['#667eea','#764ba2','#3498db','#e74c3c','#f39c12','#27ae60','#fd79a8'];
  const pp=Array.from({length:60},()=>({
    x:Math.random()*c.width,y:-10,
    vx:(Math.random()-.5)*2.5,vy:Math.random()*3+2,
    r:Math.random()*5+3,rot:0,rv:(Math.random()-.5)*.18,
    col:cols[Math.floor(Math.random()*cols.length)]
  }));
  let f=0;
  (function d(){
    ctx.clearRect(0,0,c.width,c.height);
    pp.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=p.rv;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.col;ctx.fillRect(-p.r,-p.r*.4,p.r*2,p.r*.8);ctx.restore();
    });
    if(++f<100) requestAnimationFrame(d);
    else ctx.clearRect(0,0,c.width,c.height);
  })();
}

// ═══════════════════════════════════════════════════════════════════════
// SVG HELPERS
// ═══════════════════════════════════════════════════════════════════════
function fadeIn(id,dur){
  const el=document.getElementById(id);
  if(!el) return;
  const t0=performance.now();
  (function s(now){
    const t=Math.min((now-t0)/dur,1);
    el.setAttribute('opacity',t);
    if(t<1) requestAnimationFrame(s);
  })(performance.now());
}
</script>
