<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Doodle Lab — Sentence Diagramming Playground</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --nb-line:#b3d4f0;--nb-margin:#f5c6c6;
  --noun:#4A90E2;--verb:#E24A4A;--adj:#66BB6A;--adv:#AB47BC;
  --prep:#8D6E63;--conj:#FF7043;--intj:#F9A825;--art:#26A69A;
  --pron:#5C6BC0;--verbal:#00ACC1;--punct:#9E9E9E;
}
body{
  font-family:'Segoe UI',system-ui,sans-serif;
  background:#fff;
  background-image:
    repeating-linear-gradient(transparent 0,transparent 27px,var(--nb-line) 27px,var(--nb-line) 28px),
    linear-gradient(90deg,transparent 59px,var(--nb-margin) 59px,var(--nb-margin) 61px,transparent 61px);
  min-height:100vh;color:#333;
}
/* HEADER */
#hdr{
  background:#fff8e1;border-bottom:3px solid #FFD54F;
  padding:10px 18px;display:flex;align-items:center;
  justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.1);
  position:sticky;top:0;z-index:100;
}
#hdr h1{font-size:1.25rem;font-weight:900;color:#5D4037;letter-spacing:-0.5px}
#hdr .sub{font-size:.75rem;color:#8D6E63;margin-left:8px}
.stats{display:flex;gap:10px;align-items:center}
.stat{
  background:#fff;border:2px solid #FFD54F;border-radius:20px;
  padding:4px 14px;text-align:center;min-width:60px;
}
.stat-l{font-size:9px;text-transform:uppercase;color:#8D6E63;letter-spacing:1px;display:block}
.stat-v{font-size:1.2rem;font-weight:900;color:#E65100;display:block;line-height:1.1}
/* LAYOUT */
#mob-lvl-bar{display:none} /* hidden on desktop, shown by media query on mobile */
#layout{display:flex;height:calc(100vh - 56px);overflow:hidden}
/* SIDEBAR */
#sidebar{
  width:190px;background:rgba(255,255,255,.88);
  border-right:2px solid #e0e0e0;overflow-y:auto;
  padding:12px 8px;flex-shrink:0;
}
#sidebar h2{font-size:.72rem;text-transform:uppercase;letter-spacing:2px;color:#8D6E63;margin-bottom:12px;padding:0 4px}
.lvl-item{
  display:flex;align-items:center;gap:8px;
  padding:6px 8px;border-radius:8px;cursor:pointer;
  transition:background .15s;margin-bottom:2px;
}
.lvl-item:hover{background:rgba(255,213,79,.25)}
.lvl-item.active{background:#FFF3E0;border-left:3px solid #FF8F00;padding-left:5px}
.lvl-dot{
  width:26px;height:26px;border-radius:50%;background:#e0e0e0;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:#757575;flex-shrink:0;
  border:2px solid #ccc;
}
.lvl-dot.done{background:#66BB6A;border-color:#43A047;color:#fff}
.lvl-dot.cur{background:#FF8F00;border-color:#E65100;color:#fff}
.lvl-name{font-size:11px;font-weight:600;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl-diff{font-size:9px;color:#9E9E9E;text-transform:uppercase;letter-spacing:.5px}
/* CONTENT */
#content{flex:1;display:flex;flex-direction:column;overflow:hidden}
/* SENTENCE DISPLAY */
#sent-area{
  background:rgba(255,255,255,.92);border-bottom:2px solid #e0e0e0;
  padding:12px 18px;flex-shrink:0;
}
.sent-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.lvl-badge{
  background:linear-gradient(135deg,#FF8F00,#FF6F00);
  color:#fff;font-size:10px;font-weight:700;padding:2px 10px;
  border-radius:12px;text-transform:uppercase;letter-spacing:1px;
}
.sent-title{font-size:.9rem;font-weight:700;color:#5D4037}
.diff-badge{font-size:9px;padding:2px 8px;border-radius:10px;font-weight:600}
.diff-Beginner{background:#E8F5E9;color:#2E7D32}
.diff-Intermediate{background:#FFF3E0;color:#E65100}
.diff-Advanced{background:#FCE4EC;color:#AD1457}
.diff-Expert{background:#EDE7F6;color:#4527A0}
.sent-text{
  font-size:1.05rem;font-style:italic;color:#444;
  margin-bottom:8px;background:rgba(255,248,225,.6);
  padding:5px 10px;border-radius:6px;border-left:3px solid #FFD54F;
}
.sent-summary{font-size:.78rem;color:#666;margin-bottom:10px;line-height:1.5}
#tiles{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
/* WORD TILES */
.tile{
  display:inline-flex;flex-direction:column;align-items:center;
  padding:6px 11px 4px;background:#fff;border-radius:8px;
  border:2px solid #e0e0e0;
  box-shadow:2px 3px 6px rgba(0,0,0,.12),inset 0 -2px 0 rgba(0,0,0,.07);
  cursor:grab;user-select:none;
  transition:transform .1s,box-shadow .1s,opacity .15s;
}
.tile:hover{transform:translateY(-2px);box-shadow:2px 5px 10px rgba(0,0,0,.18)}
.tile:active{cursor:grabbing}
.tile.dragging{opacity:.35;transform:scale(.9)}
.tile.placed{opacity:.45;cursor:default;border-style:dashed}
.tile.lit{box-shadow:0 0 0 3px rgba(255,213,79,.5),2px 3px 6px rgba(0,0,0,.12)}
.tile-w{font-size:.9rem;font-weight:700;color:#333;line-height:1.2}
.tile-p{
  font-size:8px;font-weight:700;padding:2px 5px;border-radius:8px;
  text-transform:uppercase;letter-spacing:.4px;margin-top:2px;color:#fff;
}
.tile-p.pos-interjection{color:#333}
/* TABS */
#tabs{
  display:flex;background:rgba(255,255,255,.85);
  border-bottom:2px solid #e0e0e0;padding:0 18px;flex-shrink:0;overflow-x:auto;
}
.tab{
  padding:9px 14px;border:none;background:none;cursor:pointer;
  font-size:.78rem;font-weight:600;color:#999;
  border-bottom:3px solid transparent;margin-bottom:-2px;
  transition:color .15s,border-color .15s;white-space:nowrap;
}
.tab:hover{color:#5D4037}
.tab.on{color:#FF8F00;border-bottom-color:#FF8F00}
/* TAB PANES */
#panes{flex:1;overflow-y:auto;background:rgba(255,255,255,.55)}
.pane{display:none;padding:18px}
.pane.on{display:block}
/* WORKSPACE */
.ws-hint{font-size:.8rem;color:#888;margin-bottom:14px;font-style:italic}
.dz-grid{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px}
.dz-group{display:flex;flex-direction:column;align-items:center;gap:4px}
.dz-label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#888;font-weight:700}
.dz{
  min-width:90px;min-height:54px;border:2.5px dashed #ccc;
  border-radius:10px;padding:7px;background:rgba(255,255,255,.8);
  transition:all .15s;display:flex;flex-direction:column;
  gap:4px;align-items:center;
}
.dz.over{border-color:#4A90E2;border-style:solid;background:rgba(74,144,226,.07);transform:scale(1.03)}
.dz.has{border-style:solid;border-color:#bbb;background:#fff}
.dz.ok{border-color:#66BB6A;background:rgba(102,187,106,.1)}
.dz.bad{border-color:#E24A4A;background:rgba(226,74,74,.08)}
.dz-ph{font-size:11px;color:#ccc;font-style:italic;text-align:center;padding:4px}
.dtile{
  background:#fff;border:1.5px solid #ddd;border-radius:6px;
  padding:3px 9px;font-size:.82rem;font-weight:600;
  display:flex;align-items:center;gap:4px;cursor:default;
}
.dtile .rm{font-size:10px;color:#bbb;cursor:pointer;padding:0 2px}
.dtile .rm:hover{color:#E24A4A}
.ws-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{
  padding:7px 16px;border-radius:20px;border:none;cursor:pointer;
  font-size:.82rem;font-weight:700;
  transition:transform .1s,box-shadow .1s;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.15)}
.btn-p{background:linear-gradient(135deg,#FF8F00,#FF6F00);color:#fff}
.btn-s{background:#fff;color:#666;border:2px solid #ddd}
.btn-g{background:linear-gradient(135deg,#66BB6A,#43A047);color:#fff}
.ws-fb{
  margin-top:10px;padding:11px 15px;border-radius:10px;
  font-size:.88rem;display:none;line-height:1.4;
}
.ws-fb.on{display:block}
.ws-fb.ok{background:#E8F5E9;border-left:4px solid #66BB6A;color:#2E7D32}
.ws-fb.bad{background:#FFEBEE;border-left:4px solid #E24A4A;color:#B71C1C}
/* DIAGRAM */
.diag-wrap{font-family:'Courier New',monospace;overflow-x:auto;padding:10px 0}
.diag-popouts{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.diag-popout{
  font-size:.88rem;color:#777;padding:4px 12px;
  border:2px dashed #ccc;border-radius:8px;background:rgba(255,255,255,.7);
  position:relative;
}
.diag-popout-lbl{font-size:8px;display:block;text-transform:uppercase;color:#bbb;letter-spacing:1px}
.diag-main{display:flex;align-items:flex-end;flex-wrap:wrap;row-gap:0}
.diag-seg{display:flex;flex-direction:column;align-items:center}
.diag-word{
  font-size:.95rem;font-weight:700;padding:3px 14px;
  border-bottom:3px solid #333;white-space:nowrap;min-width:55px;text-align:center;
}
.diag-div{width:3px;height:48px;background:#333;align-self:flex-end}
.diag-div.slant{
  transform:skewX(15deg);background:#333;
  transform-origin:bottom center;
}
.diag-mods{display:flex;flex-direction:column;align-items:flex-start;margin-top:0;padding-top:2px}
.diag-mod-item{
  font-size:.78rem;color:#555;padding:1px 8px;
  border-bottom:1.5px solid #999;margin-top:2px;
  white-space:nowrap;min-width:40px;text-align:center;
  position:relative;
}
.diag-mod-item::before{
  content:'';position:absolute;top:0;left:-14px;
  width:14px;height:100%;
  border-bottom:1.5px solid #999;
  transform:skewY(30deg);transform-origin:bottom left;
}
.diag-clause-area{
  margin-top:18px;padding-top:14px;
  border-top:2px dashed #bbb;
}
.diag-clause-lbl{
  font-size:9px;color:#aaa;text-transform:uppercase;
  letter-spacing:1px;margin-bottom:8px;
}
.diag-connector{
  font-size:.7rem;color:#bbb;letter-spacing:1px;
  margin:4px 0 4px 20px;
  font-style:italic;
}
/* DETECTIVE */
#det-panel{display:flex;flex-direction:column;gap:12px}
.det-card{
  background:#FFFDE7;border:2px solid #FFD54F;border-radius:12px;
  padding:15px;transform:rotate(-.3deg);
  box-shadow:3px 3px 8px rgba(0,0,0,.1);
}
.det-word{font-size:1.4rem;font-weight:900;color:#333;margin-bottom:3px}
.det-pos{
  display:inline-block;font-size:10px;font-weight:700;
  padding:2px 9px;border-radius:10px;color:#fff;
  text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;
}
.det-pos.pos-interjection{color:#333}
.det-grid{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:.82rem}
.det-k{font-weight:700;color:#8D6E63;white-space:nowrap}
.det-v{color:#444}
.mem-tip{
  margin-top:10px;padding:9px 12px;background:rgba(255,255,255,.7);
  border-radius:8px;border-left:3px solid #FFD54F;
  font-size:.78rem;color:#555;font-style:italic;
}
.det-empty{text-align:center;color:#aaa;font-style:italic;padding:40px 20px;font-size:.88rem}
/* PRACTICE */
.prac-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.prac-score-row{display:flex;gap:10px;align-items:center}
.psc{background:#fff;border:2px solid #FFD54F;border-radius:20px;padding:4px 14px;text-align:center}
.psc-l{font-size:9px;text-transform:uppercase;color:#999;letter-spacing:1px;display:block}
.psc-v{font-size:1.1rem;font-weight:900;color:#FF8F00;display:block;line-height:1.1}
.q-dots{display:flex;gap:5px}
.qdot{width:10px;height:10px;border-radius:50%;background:#e0e0e0}
.qdot.done{background:#66BB6A}
.qdot.cur{background:#FF8F00}
.qdot.err{background:#E24A4A}
.q-card{
  background:#fff;border-radius:12px;padding:18px;
  box-shadow:0 2px 12px rgba(0,0,0,.09);border:2px solid #f0f0f0;
  margin-bottom:14px;
}
.q-num{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:#bbb;margin-bottom:7px}
.q-text{font-size:.93rem;font-weight:600;color:#333;line-height:1.5;margin-bottom:14px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{
  text-align:left;padding:9px 14px;border-radius:8px;
  border:2px solid #e0e0e0;background:#fff;cursor:pointer;
  font-size:.85rem;color:#444;transition:all .15s;
  display:flex;align-items:center;gap:9px;
}
.opt:hover:not(:disabled){border-color:#FFD54F;background:#FFFDE7}
.opt.sel{border-color:#4A90E2;background:#E3F2FD;color:#1565C0}
.opt.ok{border-color:#66BB6A;background:#E8F5E9;color:#2E7D32}
.opt.bad{border-color:#E24A4A;background:#FFEBEE;color:#B71C1C}
.opt-let{
  width:21px;height:21px;border-radius:50%;background:#f0f0f0;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;flex-shrink:0;
}
.prac-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.hint-box{
  margin-top:10px;padding:9px 13px;background:#FFF8E1;
  border-left:3px solid #FFD54F;border-radius:0 8px 8px 0;
  font-size:.78rem;color:#8D6E63;display:none;
}
.hint-box.on{display:block}
.fb-box{
  margin-top:10px;padding:10px 15px;border-radius:8px;
  font-size:.85rem;display:none;line-height:1.4;
}
.fb-box.on{display:block}
.fb-ok{background:#E8F5E9;color:#2E7D32;border-left:3px solid #66BB6A}
.fb-bad{background:#FFEBEE;color:#B71C1C;border-left:3px solid #E24A4A}
/* TEACHER NOTES */
.tn-wrap{display:flex;flex-direction:column;gap:12px}
.sn{
  padding:14px 16px;border-radius:4px;position:relative;
  box-shadow:2px 3px 8px rgba(0,0,0,.1);font-size:.82rem;line-height:1.65;
}
.sn::before{
  content:'';position:absolute;top:0;left:0;right:0;
  height:4px;border-radius:4px 4px 0 0;
}
.sn-y{background:#FFFDE7}.sn-y::before{background:#FFD54F}
.sn-b{background:#E3F2FD}.sn-b::before{background:#42A5F5}
.sn-g{background:#E8F5E9}.sn-g::before{background:#66BB6A}
.sn-pk{background:#FCE4EC}.sn-pk::before{background:#EC407A}
.sn-o{background:#FFF3E0}.sn-o::before{background:#FF8F00}
.sn-t{font-weight:800;font-size:.76rem;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:7px;color:#5D4037}
.sn ul{list-style:none;padding:0}
.sn li{padding:2px 0 2px 16px;position:relative}
.sn li::before{content:'→';position:absolute;left:0;color:#FF8F00;font-size:10px;top:3px}
.ak{
  background:#212121;color:#69F0AE;padding:11px 15px;
  border-radius:8px;font-family:'Courier New',monospace;
  font-size:.82rem;letter-spacing:.3px;
}
/* COLLAPSER */
.col-hdr{
  cursor:pointer;display:flex;align-items:center;
  justify-content:space-between;padding:9px 13px;
  background:rgba(255,255,255,.7);border-radius:8px;
  font-weight:700;font-size:.82rem;color:#5D4037;
  border:1.5px solid #e0e0e0;user-select:none;
}
.col-hdr:hover{background:rgba(255,248,225,.7)}
.col-arr{transition:transform .2s;font-size:11px}
.col-arr.open{transform:rotate(90deg)}
.col-body{
  display:none;padding:11px 13px;
  background:rgba(255,255,255,.5);
  border-radius:0 0 8px 8px;font-size:.82rem;
  border:1.5px solid #e0e0e0;border-top:none;
}
.col-body.open{display:block}
/* MISC */
.done-banner{
  background:linear-gradient(135deg,#66BB6A,#43A047);
  color:#fff;padding:11px 16px;border-radius:10px;
  text-align:center;font-weight:700;display:none;
  font-size:.9rem;
}
.done-banner.on{display:block;animation:popIn .3s ease}
@keyframes popIn{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .3s ease}
/* GENERATE BAR */
#gen-bar{
  display:flex;align-items:center;gap:10px;margin-top:10px;
  padding:8px 12px;background:rgba(255,248,225,.75);
  border-radius:10px;border:1.5px dashed #FFD54F;flex-wrap:wrap;
}
#gen-bar label{font-size:.76rem;color:#8D6E63;font-weight:700}
#gen-bar select{
  padding:4px 8px;border-radius:7px;border:1.5px solid #ddd;
  background:#fff;font-size:.8rem;color:#333;cursor:pointer;
}
.gen-badge{
  font-size:9px;padding:2px 8px;border-radius:10px;
  background:#E3F2FD;color:#1565C0;font-weight:700;letter-spacing:.5px;
  display:none;
}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#ddd;border-radius:3px}
/* POS background colors for badges */
.pos-noun{background:var(--noun)}.pos-verb{background:var(--verb)}
.pos-adjective{background:var(--adj)}.pos-adverb{background:var(--adv)}
.pos-preposition{background:var(--prep)}.pos-conjunction{background:var(--conj)}
.pos-interjection{background:var(--intj)}.pos-article{background:var(--art)}
.pos-pronoun{background:var(--pron)}.pos-verbal{background:var(--verbal)}
.pos-punctuation{background:var(--punct)}
/* tile border by pos */
.tb-noun{border-color:var(--noun)}.tb-verb{border-color:var(--verb)}
.tb-adjective{border-color:var(--adj)}.tb-adverb{border-color:var(--adv)}
.tb-preposition{border-color:var(--prep)}.tb-conjunction{border-color:var(--conj)}
.tb-interjection{border-color:var(--intj)}.tb-article{border-color:var(--art)}
.tb-pronoun{border-color:var(--pron)}.tb-verbal{border-color:var(--verbal)}
.tb-punctuation{border-color:var(--punct)}
@media(max-width:700px){
  /* layout: stack vertically, scroll freely */
  #layout{height:auto;overflow:visible;display:block}
  #sidebar{display:none}
  #content{width:100%;height:auto;overflow:visible}
  #pane-ws,#pane-diag,#pane-det,#pane-prac,#pane-tn{
    height:auto;overflow:visible;
  }
  /* horizontal level chip bar */
  #mob-lvl-bar{
    display:flex;gap:8px;padding:8px 12px;
    overflow-x:auto;background:rgba(255,255,255,.92);
    border-bottom:1px solid #e0e0e0;flex-shrink:0;
    -webkit-overflow-scrolling:touch;
  }
  .mob-chip{
    flex-shrink:0;padding:5px 14px;border-radius:20px;
    font-size:.72rem;font-weight:700;cursor:pointer;
    background:#f3f4f6;border:2px solid #d1d5db;color:#374151;
    white-space:nowrap;
  }
  .mob-chip.active{background:var(--indigo,#4338ca);border-color:var(--indigo,#4338ca);color:#fff}
  /* bigger touch targets for tiles */
  .tile{padding:10px 14px 6px;min-height:52px;cursor:pointer}
  .tile.selected{
    outline:3px solid var(--indigo,#4338ca);
    box-shadow:0 0 0 5px rgba(99,102,241,.18);
    transform:translateY(-3px);
  }
  /* drop zones easier to tap */
  .dz{min-height:52px;padding:8px}
  .tab{padding:10px 12px;font-size:.72rem}
  /* header wraps gracefully */
  #hdr{flex-wrap:wrap;gap:6px}
  .stats{gap:6px}
  .stat{min-width:50px;padding:3px 10px}
  /* gen bar stacks */
  .gen-bar{flex-direction:column;gap:8px;align-items:stretch}
  .gen-bar select,.gen-bar button{width:100%}
}

/* ═══════════════════════════════════════════
   LEARNING HUB DESIGN SYSTEM INTEGRATION
   Matches index.html: navy/indigo/violet theme
═══════════════════════════════════════════ */
:root{
  --navy:#1e1b4b;--indigo:#4338ca;--violet:#6366f1;
  --vlt:#eef2ff;--bg:#f1f5f9;--surface:#fff;
  --border:#e2e8f0;--muted:#64748b;--txt:#0f172a;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg);color:var(--txt);
  background-image:none;
}
/* Header → navy hero gradient */
#hdr{
  background:linear-gradient(145deg,#1e1b4b 0%,#312e81 45%,#4c1d95 100%);
  border-bottom:none;box-shadow:0 2px 14px rgba(0,0,0,.22);gap:12px;
}
#hdr h1{color:#fff}
#hdr .sub{color:rgba(255,255,255,.6)}
.stat{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22)}
.stat-l{color:rgba(255,255,255,.55)}
.stat-v{color:#fcd34d}
/* Back link */
.back-link{
  color:rgba(255,255,255,.65);text-decoration:none;font-size:.76rem;
  font-weight:600;padding:4px 10px;border-radius:6px;
  border:1px solid rgba(255,255,255,.22);transition:all .15s;
  white-space:nowrap;flex-shrink:0;
}
.back-link:hover{color:#fff;background:rgba(255,255,255,.1)}
/* Sidebar */
#sidebar{background:var(--surface);border-right-color:var(--border)}
#sidebar h2{color:var(--muted)}
.lvl-name{color:var(--navy)}
.lvl-diff{color:#94a3b8}
.lvl-item:hover{background:var(--vlt)}
.lvl-item.active{background:var(--vlt);border-left-color:var(--indigo)}
.lvl-dot.cur{background:var(--indigo);border-color:#3730a3}
/* Sentence area */
#sent-area{background:var(--surface);border-bottom-color:var(--border)}
.sent-title{color:var(--navy)}
.sent-text{background:var(--vlt);border-left-color:var(--violet);color:#334155}
.sent-summary{color:var(--muted)}
/* Tabs */
#tabs{background:var(--surface);border-bottom-color:var(--border)}
.tab{color:var(--muted)}
.tab:hover{color:var(--txt)}
.tab.on{color:var(--indigo);border-bottom-color:var(--indigo)}
/* Tab panes background */
#panes{background:var(--bg)}
/* Badges and buttons */
.lvl-badge{background:linear-gradient(135deg,var(--indigo),var(--violet))}
.btn-p{background:linear-gradient(135deg,var(--indigo),var(--violet))}
/* Workspace */
.ws-hint{color:var(--muted)}
.dz-label{color:var(--muted)}
.dz{background:rgba(255,255,255,.9)}
.dz.over{border-color:var(--indigo);background:rgba(67,56,202,.06);transform:scale(1.02)}
/* Detective */
.det-card{background:var(--vlt);border-color:#818cf8}
.det-k{color:var(--indigo)}
.mem-tip{border-left-color:var(--violet);color:#475569;background:rgba(255,255,255,.8)}
.det-empty{color:#94a3b8}
/* Practice */
.psc{border-color:#c7d2fe}
.psc-v{color:var(--indigo)}
.q-card{border-color:var(--border);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.opt:hover:not(:disabled){border-color:#818cf8;background:var(--vlt)}
.opt.sel{border-color:var(--indigo);background:var(--vlt);color:var(--navy)}
/* Generate bar */
#gen-bar{background:var(--vlt);border-color:#818cf8}
#gen-bar label{color:var(--indigo)}
#gen-bar select{border-color:#c7d2fe;color:var(--navy)}
.gen-badge{background:#c7d2fe;color:#3730a3}
/* Teacher notes */
.sn-t{color:var(--navy)}
.sn li::before{color:var(--indigo)}
.col-hdr{color:var(--navy);border-color:var(--border)}
.col-hdr:hover{background:var(--vlt)}
</style>
</head>
<body>

<div id="hdr">
  <a href="index.html" class="back-link">&#x2190; Learning Hub</a>
  <div style="display:flex;align-items:baseline;gap:0;flex:1;min-width:0">
    <h1>&#x1F4DD; Grammar Doodle Lab</h1>
    <span class="sub">Sentence Diagramming Playground</span>
  </div>
  <div class="stats">
    <div class="stat">
      <span class="stat-l">Score</span>
      <span class="stat-v" id="g-score">0</span>
    </div>
    <div class="stat">
      <span class="stat-l">&#x1F525; Streak</span>
      <span class="stat-v" id="g-streak">0</span>
    </div>
  </div>
</div>

<div id="mob-lvl-bar"></div>
<div id="layout">
  <aside id="sidebar">
    <h2>Level Map</h2>
    <div id="lvl-list"></div>
  </aside>
  <div id="content">
    <div id="sent-area">
      <div class="sent-meta" id="sent-meta"></div>
      <div class="sent-text" id="sent-text"></div>
      <div class="sent-summary" id="sent-sum"></div>
      <div id="tiles"></div>
      <div id="gen-bar">
        <span style="font-size:.82rem;font-weight:800;color:#5D4037">&#x1F3B2; Random Sentence</span>
        <label>Level</label>
        <select id="gen-level">
          <option value="1">1 – Subject + Verb</option>
          <option value="2">2 – Add Modifiers</option>
          <option value="3">3 – Prepositional Phrase</option>
          <option value="4">4 – Compound (Conjunctions)</option>
          <option value="5">5 – Interjections + Direct Address</option>
          <option value="6">6 – Direct + Indirect Object</option>
          <option value="7">7 – Linking Verb</option>
        </select>
        <label>Difficulty</label>
        <select id="gen-diff">
          <option value="Beginner">Beginner</option>
          <option value="Intermediate">Intermediate</option>
          <option value="Advanced">Advanced</option>
        </select>
        <button class="btn btn-p" onclick="generateRandom()" style="padding:5px 14px;font-size:.8rem">&#x1F3B2; Generate</button>
        <span class="gen-badge" id="gen-badge">Generated</span>
      </div>
    </div>
    <div id="tabs">
      <button class="tab on" data-tab="ws">&#x1F5C2; Workspace</button>
      <button class="tab" data-tab="diag">&#x270F; Diagram</button>
      <button class="tab" data-tab="det">&#x1F50D; Detective</button>
      <button class="tab" data-tab="prac">&#x1F3AF; Practice</button>
      <button class="tab" data-tab="tn">&#x1F4CC; Teacher Notes</button>
    </div>
    <div id="panes">
      <div class="pane on" id="pane-ws"></div>
      <div class="pane" id="pane-diag"></div>
      <div class="pane" id="pane-det"></div>
      <div class="pane" id="pane-prac"></div>
      <div class="pane" id="pane-tn"></div>
    </div>
  </div>
</div>

<script>
// ============================  DATA  ============================
const LEVELS = [
 {
  id:1,level:1,difficulty:"Beginner",title:"Build the Main Line",
  sentence:"Birds sing.",
  summary:"Every sentence needs two things: a subject (who/what) and a predicate (what they do). These go on the main line.",
  words:[
   {w:"Birds",pos:"noun",job:"subject",mod:null,
    exp:"The subject tells us WHO or WHAT performs the action.",
    tip:"Subject = Star of the show! The sentence is all about them."},
   {w:"sing",pos:"verb",job:"predicate",mod:null,
    exp:"The verb (predicate) tells us WHAT the subject does.",
    tip:"Verb = Action! If you can do it, it's probably a verb."},
   {w:".",pos:"punctuation",job:"end mark",mod:null,
    exp:"A period ends a declarative sentence.",tip:"Stop sign for sentences!"}
  ],
  zones:[
   {id:"subj",label:"Subject",expected:["Birds"]},
   {id:"verb",label:"Verb / Predicate",expected:["sing"]}
  ],
  diagram:{
   type:"simple",
   main:[{w:"Birds"},{div:"|"},{w:"sing"}],
   mods:[],clauses:[],popouts:[]
  },
  questions:[
   {q:"In 'Birds sing,' what is the subject?",opts:["sing","Birds","the sentence","loudly"],ans:1,hint:"The subject is who or what performs the action."},
   {q:"What is the verb (predicate) in 'Birds sing'?",opts:["Birds","quietly","sing","in"],ans:2,hint:"The verb tells what the subject does."},
   {q:"Which part of speech is 'Birds'?",opts:["Verb","Adjective","Adverb","Noun"],ans:3,hint:"Nouns name people, places, things, or ideas."}
  ],
  tn:{
   exp:"The simple subject is the main noun. The simple predicate is the main verb. In traditional diagramming, a horizontal line is drawn with a vertical bar separating them.",
   mistakes:["Including adjectives in the subject slot—only the noun goes on the main line.","Thinking 'is/are' are not predicates—all verbs are predicates."],
   teach:"Have students act out the sentence: one student IS the bird, another SINGS.",
   similar:["Cats sleep.","Dogs bark.","Fish swim.","Children laugh."],
   key:"Subject: Birds | Predicate: sing"
  }
 },
 {
  id:2,level:2,difficulty:"Beginner",title:"Add Modifiers",
  sentence:"The tiny birds sing sweetly.",
  summary:"Adjectives describe nouns; adverbs describe verbs. In a diagram, modifiers hang below the words they describe on diagonal lines.",
  words:[
   {w:"The",pos:"article",job:"modifier",mod:"birds",exp:"An article (the, a, an) is a special adjective signaling a noun is coming.",tip:"'The' = specific thing. 'A/An' = any one thing."},
   {w:"tiny",pos:"adjective",job:"modifier",mod:"birds",exp:"Adjectives describe nouns—what kind, how many, which one.",tip:"Adjective = adds detail to a noun. Ask 'What kind? Which one? How many?'"},
   {w:"birds",pos:"noun",job:"subject",mod:null,exp:"The simple subject—who the sentence is about.",tip:"This is the star! Modifiers are the supporting cast."},
   {w:"sing",pos:"verb",job:"predicate",mod:null,exp:"Action verb—what the subject does.",tip:"Verb = Action word!"},
   {w:"sweetly",pos:"adverb",job:"modifier",mod:"sing",exp:"Adverbs modify verbs, adjectives, or other adverbs. Many end in -ly.",tip:"Adverbs answer: HOW? WHEN? WHERE? Sweetly = HOW they sing."},
   {w:".",pos:"punctuation",job:"end mark",mod:null,exp:"Period ends the sentence.",tip:"Stop!"}
  ],
  zones:[
   {id:"subj",label:"Subject",expected:["birds"]},
   {id:"verb",label:"Verb",expected:["sing"]},
   {id:"adj-mod",label:"Adjective Modifiers",expected:["The","tiny"],multi:true},
   {id:"adv-mod",label:"Adverb Modifiers",expected:["sweetly"],multi:true}
  ],
  diagram:{
   type:"modifiers",
   main:[{w:"birds"},{div:"|"},{w:"sing"}],
   mods:[{w:"The",under:"birds"},{w:"tiny",under:"birds"},{w:"sweetly",under:"sing"}],
   clauses:[],popouts:[]
  },
  questions:[
   {q:"Which word is an adverb in 'The tiny birds sing sweetly'?",opts:["tiny","birds","sweetly","The"],ans:2,hint:"Adverbs often end in -ly and describe verbs."},
   {q:"What does the adjective 'tiny' modify?",opts:["sing","birds","sweetly","The"],ans:1,hint:"Adjectives always modify nouns."},
   {q:"In sentence diagramming, where do modifiers go?",opts:["On the main line to the right","Above the words they modify","Below the words they modify","On a separate line"],ans:2,hint:"Think of modifiers as hanging down from the words they describe."}
  ],
  tn:{
   exp:"Modifiers are placed on diagonal lines hanging below the words they describe. Articles (a, an, the) are treated as adjectives.",
   mistakes:["Confusing adjectives and adverbs—adjectives describe NOUNS, adverbs describe VERBS/ADJ/ADV.","Placing adverbs under the subject noun instead of the verb."],
   teach:"Color-code adjectives and adverbs differently. Have students draw arrows from modifiers to the words they describe.",
   similar:["A big red dog barks loudly.","Three sleepy children played quietly.","The old clock ticks steadily."],
   key:"Subject: birds (modifiers: The, tiny) | Predicate: sing (modifier: sweetly)"
  }
 },
 {
  id:3,level:3,difficulty:"Beginner",title:"Add Prepositional Phrases",
  sentence:"The birds sing in the tall trees.",
  summary:"A prepositional phrase = preposition + object. It acts as an adjective (describes a noun) or adverb (describes a verb).",
  words:[
   {w:"The",pos:"article",job:"modifier",mod:"birds",exp:"Article modifying 'birds'.",tip:"'The' signals a specific noun."},
   {w:"birds",pos:"noun",job:"subject",mod:null,exp:"Simple subject of the sentence.",tip:"Who is doing the action?"},
   {w:"sing",pos:"verb",job:"predicate",mod:null,exp:"Action verb—what the birds do.",tip:"What is the action?"},
   {w:"in",pos:"preposition",job:"preposition",mod:"sing",exp:"A preposition shows relationship between its object and another word. 'In' shows location.",tip:"Prepositions: anywhere a mouse can go—IN a box, ON a box, UNDER a box..."},
   {w:"the",pos:"article",job:"modifier",mod:"trees",exp:"Article modifying 'trees'.",tip:"Specific trees!"},
   {w:"tall",pos:"adjective",job:"modifier",mod:"trees",exp:"Adjective describing the trees.",tip:"What kind of trees?"},
   {w:"trees",pos:"noun",job:"object of preposition",mod:null,exp:"The object of the preposition—answers 'in WHAT?'",tip:"Every preposition needs an object to complete the phrase."},
   {w:".",pos:"punctuation",job:"end mark",mod:null,exp:"Period.",tip:"Stop sign!"}
  ],
  zones:[
   {id:"subj",label:"Subject",expected:["birds"]},
   {id:"verb",label:"Verb",expected:["sing"]},
   {id:"prep",label:"Preposition",expected:["in"]},
   {id:"obj-prep",label:"Object of Prep",expected:["trees"]}
  ],
  diagram:{
   type:"prepositional",
   main:[{w:"birds"},{div:"|"},{w:"sing"}],
   mods:[{w:"The",under:"birds"}],
   clauses:[],popouts:[],
   preps:[{prep:"in",obj:"trees",obj_mods:["the","tall"],attachedTo:"sing"}]
  },
  questions:[
   {q:"What is the preposition in 'in the tall trees'?",opts:["tall","trees","in","the"],ans:2,hint:"Prepositions show relationships like location, time, or direction."},
   {q:"What is the object of the preposition?",opts:["in","tall","the","trees"],ans:3,hint:"Ask: 'in WHAT?' — that noun is the object of the preposition."},
   {q:"The phrase 'in the tall trees' acts as which part of speech here?",opts:["Adjective (describes birds)","Adverb (describes sing)","Noun (is the subject)","Conjunction"],ans:1,hint:"Does the phrase describe a noun or a verb?"}
  ],
  tn:{
   exp:"Prepositional phrases are drawn below on a diagonal line from the preposition, with a horizontal line for the object. Modifiers of the object hang below it.",
   mistakes:["Confusing the preposition with the object.","Attaching the phrase to the wrong word on the main line."],
   teach:"Teach 'anywhere a mouse can go' for prepositions: in, on, under, over, beside, between, through, around.",
   similar:["The cat sits on the warm mat.","Students work in small groups.","The book fell under the desk."],
   key:"Subject: birds | Predicate: sing | Prep Phrase: in trees (adj: tall, art: the) — modifies 'sing'"
  }
 },
 {
  id:4,level:4,difficulty:"Intermediate",title:"Connect Ideas",
  sentence:"Birds and frogs sing and croak.",
  summary:"Coordinating conjunctions (FANBOYS) connect equal parts. Two subjects = compound subject. Two verbs = compound predicate.",
  words:[
   {w:"Birds",pos:"noun",job:"subject (1)",mod:null,exp:"First part of the compound subject.",tip:"First subject!"},
   {w:"and",pos:"conjunction",job:"coordinating conjunction",mod:null,exp:"Connects 'Birds' and 'frogs'—both are subjects.",tip:"FANBOYS: For, And, Nor, But, Or, Yet, So"},
   {w:"frogs",pos:"noun",job:"subject (2)",mod:null,exp:"Second part of the compound subject.",tip:"Second subject!"},
   {w:"sing",pos:"verb",job:"predicate (1)",mod:null,exp:"First part of the compound predicate.",tip:"First action!"},
   {w:"and",pos:"conjunction",job:"coordinating conjunction",mod:null,exp:"Connects 'sing' and 'croak'.",tip:"FANBOYS again!"},
   {w:"croak",pos:"verb",job:"predicate (2)",mod:null,exp:"Second part of the compound predicate.",tip:"Second action!"},
   {w:".",pos:"punctuation",job:"end mark",mod:null,exp:"Period.",tip:"Stop!"}
  ],
  zones:[
   {id:"subj1",label:"Subject 1",expected:["Birds"]},
   {id:"subj2",label:"Subject 2",expected:["frogs"]},
   {id:"conj-s",label:"Conjunction (subjects)",expected:["and"]},
   {id:"verb1",label:"Verb 1",expected:["sing"]},
   {id:"verb2",label:"Verb 2",expected:["croak"]},
   {id:"conj-v",label:"Conjunction (verbs)",expected:["and"]}
  ],
  diagram:{
   type:"compound",
   main:[{w:"Birds / frogs"},{div:"|"},{w:"sing / croak"}],
   mods:[],clauses:[],popouts:[],
   note:"Compound subject and compound predicate each joined by 'and'"
  },
  questions:[
   {q:"What kind of conjunction is 'and' in this sentence?",opts:["Subordinating","Correlative","Coordinating","Conjunctive adverb"],ans:2,hint:"Remember FANBOYS: For, And, Nor, But, Or, Yet, So"},
   {q:"'Birds and frogs' is an example of a:",opts:["Compound predicate","Compound subject","Compound sentence","Compound object"],ans:1,hint:"When two nouns are joined as subjects, that's a compound subject."},
   {q:"Which of these is NOT a coordinating conjunction (FANBOYS)?",opts:["But","Because","Or","Yet"],ans:1,hint:"FANBOYS: For, And, Nor, But, Or, Yet, So — 'Because' is not in FANBOYS."}
  ],
  tn:{
   exp:"Compound subjects/predicates are shown on parallel horizontal lines with a dotted vertical line connecting them, and the conjunction written on the dotted line.",
   mistakes:["Confusing coordinating and subordinating conjunctions.","Thinking 'because' is in FANBOYS."],
   teach:"Have students clap once for each FANBOYS word as they recite it together.",
   similar:["Dogs bark and growl.","Cats and dogs play and sleep.","She ran but fell."],
   key:"Compound Subject: Birds + frogs (joined by 'and') | Compound Predicate: sing + croak (joined by 'and')"
  }
 },
 {
  id:5,level:5,difficulty:"Intermediate",title:"Words That Pop Out",
  sentence:"Oh, Maya, the parrot talks!",
  summary:"Interjections express emotion and have no grammatical connection to the sentence. Nouns of direct address name the person being spoken to. Both 'pop out' above the main diagram.",
  words:[
   {w:"Oh",pos:"interjection",job:"interjection",mod:null,exp:"An interjection expresses strong emotion. It has NO grammatical connection to the sentence.",tip:"Interjections inject emotion! They float on a separate line above the diagram."},
   {w:"Maya",pos:"noun",job:"noun of direct address",mod:null,exp:"A noun of direct address names the person being spoken TO. Set off by commas.",tip:"Direct address = talking TO someone. Their name 'pops out' above the diagram."},
   {w:"the",pos:"article",job:"modifier",mod:"parrot",exp:"Article modifying 'parrot'.",tip:"Specific parrot!"},
   {w:"parrot",pos:"noun",job:"subject",mod:null,exp:"The subject of the main clause.",tip:"Who talks?"},
   {w:"talks",pos:"verb",job:"predicate",mod:null,exp:"The verb—what the parrot does.",tip:"What does it do?"},
   {w:"!",pos:"punctuation",job:"end mark",mod:null,exp:"Exclamation point shows strong emotion.",tip:"Exciting!"}
  ],
  zones:[
   {id:"intj",label:"Interjection",expected:["Oh"]},
   {id:"nda",label:"Direct Address",expected:["Maya"]},
   {id:"subj",label:"Subject",expected:["parrot"]},
   {id:"verb",label:"Verb",expected:["talks"]}
  ],
  diagram:{
   type:"popout",
   main:[{w:"parrot"},{div:"|"},{w:"talks"}],
   mods:[{w:"the",under:"parrot"}],
   clauses:[],
   popouts:[{w:"Oh",type:"interjection"},{w:"Maya",type:"direct address"}]
  },
  questions:[
   {q:"In 'Oh, Maya, the parrot talks!' what is 'Oh'?",opts:["Noun","Verb","Interjection","Adjective"],ans:2,hint:"It expresses surprise/emotion and is set off by a comma."},
   {q:"What is 'Maya' in this sentence?",opts:["Subject","Object","Noun of direct address","Predicate noun"],ans:2,hint:"Is Maya doing the talking, or are we talking TO Maya?"},
   {q:"Where do interjections and nouns of direct address go in a diagram?",opts:["On the main line before the subject","On the main line after the verb","Below the diagram","Above the diagram on floating lines"],ans:3,hint:"They 'pop out' of the main sentence structure."}
  ],
  tn:{
   exp:"Interjections go on a separate line above-left of the diagram. Nouns of direct address go on a separate line above the subject. Both connect to the diagram with dotted lines.",
   mistakes:["Making the NDA the subject.","Forgetting that interjections have no grammatical connection to the sentence."],
   teach:"Role-play: 'Alex, come here!' — Alex is the NDA, not the subject.",
   similar:["Wow, the show was amazing!","Hey, Jordan, pass the ball!","No, I won't do it!"],
   key:"Interjection: Oh | NDA: Maya | Subject: parrot (with 'the') | Verb: talks"
  }
 },
 {
  id:6,level:6,difficulty:"Intermediate",title:"Action Receivers",
  sentence:"The teacher gave students a quiz.",
  summary:"Transitive verbs pass action to receivers. Direct object = WHAT was given. Indirect object = TO WHOM it was given.",
  words:[
   {w:"The",pos:"article",job:"modifier",mod:"teacher",exp:"Article modifying 'teacher'.",tip:"Specific teacher!"},
   {w:"teacher",pos:"noun",job:"subject",mod:null,exp:"The subject—who performs the action.",tip:"Who gave?"},
   {w:"gave",pos:"verb",job:"predicate (transitive)",mod:null,exp:"Transitive action verb—transfers action to an object.",tip:"'Gave' needs something to be given!"},
   {w:"students",pos:"noun",job:"indirect object",mod:null,exp:"Indirect object—answers 'gave TO WHOM?'",tip:"IO comes before the DO. Ask: 'to/for whom was the action done?'"},
   {w:"a",pos:"article",job:"modifier",mod:"quiz",exp:"Article modifying 'quiz'.",tip:"One quiz!"},
   {w:"quiz",pos:"noun",job:"direct object",mod:null,exp:"Direct object—answers 'gave WHAT?' The quiz is what was given.",tip:"Direct object = directly receives the action. Ask: 'subject verb WHAT?'"},
   {w:".",pos:"punctuation",job:"end mark",mod:null,exp:"Period.",tip:"Stop!"}
  ],
  zones:[
   {id:"subj",label:"Subject",expected:["teacher"]},
   {id:"verb",label:"Verb",expected:["gave"]},
   {id:"io",label:"Indirect Object",expected:["students"]},
   {id:"do",label:"Direct Object",expected:["quiz"]}
  ],
  diagram:{
   type:"objects",
   main:[{w:"teacher"},{div:"|"},{w:"gave"},{div:"|"},{w:"quiz"}],
   mods:[{w:"The",under:"teacher"},{w:"a",under:"quiz"}],
   clauses:[],popouts:[],
   io:"students"
  },
  questions:[
   {q:"In 'The teacher gave students a quiz,' what is the direct object?",opts:["teacher","students","quiz","gave"],ans:2,hint:"Ask: The teacher gave WHAT? The thing given is the DO."},
   {q:"What is 'students' in this sentence?",opts:["Subject","Direct object","Indirect object","Predicate noun"],ans:2,hint:"Ask: The teacher gave a quiz TO WHOM? That person is the IO."},
   {q:"Which sentence has both a direct and indirect object?",opts:["She ran quickly.","He is tall.","Mom baked us cookies.","The bird sang."],ans:2,hint:"Look for a transitive verb that transfers something to someone."}
  ],
  tn:{
   exp:"Direct objects go on the main line after the verb, separated by a vertical bar. Indirect objects go on a horizontal line below the verb, connected by a diagonal line.",
   mistakes:["Swapping direct and indirect objects.","Confusing 'to + noun' prepositional phrases with indirect objects."],
   teach:"Test: rewrite IO as 'to/for + noun': 'gave a quiz TO students.' If it works, it's an IO.",
   similar:["Dad made me breakfast.","She sent her friend a letter.","We brought the team water."],
   key:"Subject: teacher | Verb: gave | IO: students | DO: quiz (with 'a')"
  }
 },
 {
  id:7,level:7,difficulty:"Intermediate",title:"Linking and Passive Verbs",
  sentence:"The sunset looks absolutely gorgeous.",
  summary:"Linking verbs connect subject to a complement. The predicate adjective describes the subject; the predicate noun renames it. A backward-slanting line (\\) in the diagram shows it reflects back to the subject.",
  words:[
   {w:"The",pos:"article",job:"modifier",mod:"sunset",exp:"Article modifying 'sunset'.",tip:"Specific sunset!"},
   {w:"sunset",pos:"noun",job:"subject",mod:null,exp:"The subject of the sentence.",tip:"What looks gorgeous?"},
   {w:"looks",pos:"verb",job:"linking verb",mod:null,exp:"Linking verb—connects subject to its complement. 'Looks' describes a state, not an action.",tip:"Linking verbs: be, seem, appear, look, feel, smell, taste, sound, become. If 'is/are' works in its place, it's linking!"},
   {w:"absolutely",pos:"adverb",job:"modifier",mod:"gorgeous",exp:"Adverb modifying the adjective 'gorgeous'—it intensifies it.",tip:"Adverbs can modify adjectives too! 'Absolutely' tells HOW gorgeous."},
   {w:"gorgeous",pos:"adjective",job:"predicate adjective",mod:"sunset",exp:"Predicate adjective—follows a linking verb and describes the subject.",tip:"PA = after a linking verb, describes the subject. Point back: 'The sunset IS gorgeous.'"},
   {w:".",pos:"punctuation",job:"end mark",mod:null,exp:"Period.",tip:"Stop!"}
  ],
  zones:[
   {id:"subj",label:"Subject",expected:["sunset"]},
   {id:"lv",label:"Linking Verb",expected:["looks"]},
   {id:"pa",label:"Predicate Adjective",expected:["gorgeous"]}
  ],
  diagram:{
   type:"linking",
   main:[{w:"sunset"},{div:"|"},{w:"looks"},{div:"\\",slant:true},{w:"gorgeous"}],
   mods:[{w:"The",under:"sunset"},{w:"absolutely",under:"gorgeous"}],
   clauses:[],popouts:[]
  },

// ==========================  STATE  ==========================
const S = {
 level: 1,
 score: 0,
 streak: 0,
 done: new Set(),
 placements: {},   // zoneId -> [word strings]
 dragWord: null,
 dragIdx: null,
 activeWordIdx: null,
 selTile: null,
 quiz: { q:0, answered:false, sel:null, correct:0, shown:false }
};

// ==========================  HELPERS  ==========================
const $ = id => document.getElementById(id);
const posClass = pos => 'pos-' + pos.replace(/\s.*/,'').replace(/[()]/g,'').toLowerCase();
const tbClass  = pos => 'tb-'  + pos.replace(/\s.*/,'').replace(/[()]/g,'').toLowerCase();

function posColor(pos){
 const map={noun:'#4A90E2',verb:'#E24A4A',adjective:'#66BB6A',adverb:'#AB47BC',
  preposition:'#8D6E63',conjunction:'#FF7043',interjection:'#F9A825',
  article:'#26A69A',pronoun:'#5C6BC0',verbal:'#00ACC1',punctuation:'#9E9E9E'};
 const k = pos.replace(/\s.*/,'').replace(/[()]/g,'').toLowerCase();
 return map[k] || '#9E9E9E';
}

function updateHeader(){
 $('g-score').textContent = S.score;
 $('g-streak').textContent = S.streak;
}

function isTouchDev(){ return navigator.maxTouchPoints > 0; }

function renderMobLvlBar(){
 const bar=$('mob-lvl-bar'); if(!bar) return;
 bar.innerHTML='';
 LEVELS.filter(l=>l.id!=='random').forEach(lv=>{
  const chip=document.createElement('div');
  chip.className='mob-chip'+(S.level===lv.level?' active':'');
  chip.textContent='L'+lv.level+': '+lv.title.replace(/^(Build|Add|Connect|Words|Action|Linking|Adverb|Adjective|Noun|Verbals)\s/,'');
  chip.title=lv.title;
  chip.addEventListener('click',()=>loadLevel(lv.level));
  bar.appendChild(chip);
 });
}

// ==========================  LEVEL MAP  ==========================
function renderLevelMap(){
 const list = $('lvl-list'); list.innerHTML='';
 LEVELS.filter(l=>l.id!=='random').forEach(lv => {
  const d = document.createElement('div');
  d.className='lvl-item' + (lv.level===S.level?' active':'');
  d.dataset.level = lv.level;
  const dotClass = S.done.has(lv.level) ? 'done' : (lv.level===S.level ? 'cur' : '');
  d.innerHTML=`<div class="lvl-dot ${dotClass}">${S.done.has(lv.level)?'✓':lv.level}</div>
   <div><div class="lvl-name">${lv.title}</div><div class="lvl-diff">${lv.difficulty}</div></div>`;
  d.addEventListener('click',()=>loadLevel(lv.level));
  list.appendChild(d);
 });
}

// ==========================  LOAD LEVEL  ==========================
function loadLevel(n){
 S.level=n; S.placements={}; S.dragWord=null; S.dragIdx=null;
 S.activeWordIdx=null; S.selTile=null;
 S.quiz={q:0,answered:false,sel:null,correct:0,shown:false};
 const lv = LEVELS.find(l=>l.level===n);
 renderLevelMap();
 renderMobLvlBar();
 renderSentence(lv);
 renderTiles(lv);
 renderWorkspace(lv);
 renderDiagram(lv);
 renderDetective(null, lv);
 renderPractice(lv);
 renderTeacher(lv);
 switchTab('ws');
}

// ==========================  SENTENCE  ==========================
function renderSentence(lv){
 const lbl=lv.id==='random'?'&#x1F3B2; Random':'Level '+lv.level;
 $('sent-meta').innerHTML=
  `<span class="lvl-badge">${lbl}</span>
   <span class="sent-title">${lv.title}</span>
   <span class="diff-badge diff-${lv.difficulty}">${lv.difficulty}</span>`;
 $('sent-text').textContent = lv.sentence;
 $('sent-sum').textContent  = lv.summary;
}

// ==========================  TILES  ==========================
function renderTiles(lv){
 const box=$('tiles'); box.innerHTML='';
 lv.words.forEach((word,i)=>{
  const t=document.createElement('div');
  t.className=`tile ${tbClass(word.pos)}`;
  t.dataset.idx=i; t.dataset.word=word.w;
  t.draggable=true;
  t.innerHTML=`<span class="tile-w">${word.w}</span>
   <span class="tile-p ${posClass(word.pos)}">${word.pos}</span>`;
  t.addEventListener('dragstart',e=>{
   S.dragWord=word.w; S.dragIdx=i;
   t.classList.add('dragging');
   e.dataTransfer.effectAllowed='copy';
   e.dataTransfer.setData('text/plain', word.w);
  });
  t.addEventListener('dragend',()=>t.classList.remove('dragging'));
  t.addEventListener('click',()=>{
   if(isTouchDev()){
    // tap-to-select mode on touch devices
    if(S.selTile===i){
     // second tap = deselect
     S.selTile=null;
     document.querySelectorAll('.tile').forEach(x=>x.classList.remove('selected','lit'));
    } else {
     S.selTile=i; S.dragWord=word.w; S.dragIdx=i;
     document.querySelectorAll('.tile').forEach(x=>x.classList.remove('selected','lit'));
     t.classList.add('selected','lit');
     S.activeWordIdx=i;
     renderDetective(word,lv);
    }
   } else {
    document.querySelectorAll('.tile').forEach(x=>x.classList.remove('lit'));
    t.classList.add('lit');
    S.activeWordIdx=i;
    renderDetective(word, lv);
    switchTab('det');
   }
  });
  box.appendChild(t);
 });
}

function markPlaced(word){
 document.querySelectorAll('.tile').forEach(t=>{
  if(t.dataset.word===word) t.classList.add('placed');
 });
}
function unmarkPlaced(word){
 // only unmark if word not in any zone
 const allPlaced = Object.values(S.placements).flat();
 if(!allPlaced.includes(word))
  document.querySelectorAll('.tile').forEach(t=>{
   if(t.dataset.word===word) t.classList.remove('placed');
  });
}

// ==========================  WORKSPACE  ==========================
function renderWorkspace(lv){
 const pane=$('pane-ws');
 const hint=isTouchDev()
  ?'Tap a word tile to select it (highlighted), then tap a zone to place it. Tap <strong>Check</strong> when done.'
  :'Drag word tiles from above into the correct zones, then click <strong>Check</strong>.';
 pane.innerHTML=`<p class="ws-hint">${hint}</p>
  <div class="dz-grid" id="dz-grid"></div>
  <div class="ws-actions">
   <button class="btn btn-p" onclick="checkZones()">✓ Check</button>
   <button class="btn btn-s" onclick="resetZones()">↺ Reset</button>
   <button class="btn btn-g" onclick="revealZones()">👁 Reveal</button>
  </div>
  <div class="ws-fb" id="ws-fb"></div>
  <div class="done-banner" id="done-banner">🎉 Correct! Level complete! (+10 pts)</div>`;

 const grid=$('dz-grid');
 lv.zones.forEach(zone=>{
  S.placements[zone.id] = S.placements[zone.id] || [];
  const grp=document.createElement('div');
  grp.className='dz-group';
  grp.innerHTML=`<div class="dz-label">${zone.label}</div>
   <div class="dz" id="dz-${zone.id}" data-zone="${zone.id}">
    <div class="dz-ph" id="dz-ph-${zone.id}">drop here</div>
   </div>`;
  grid.appendChild(grp);
  // repaint existing placements
  S.placements[zone.id].forEach(w=>addToZone(zone.id,w));
 });

 // drop zone events
 document.querySelectorAll('.dz').forEach(dz=>{
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over')});
  dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
  dz.addEventListener('drop',e=>{
   e.preventDefault(); dz.classList.remove('over');
   if(!S.dragWord) return;
   const zid=dz.dataset.zone;
   const lvObj=LEVELS.find(l=>l.level===S.level||l.id==='random'&&S.level===99);
   const zone=lvObj.zones.find(z=>z.id===zid);
   if(!zone.multi && S.placements[zid].length>0) return;
   if(!S.placements[zid].includes(S.dragWord)){
    S.placements[zid].push(S.dragWord);
    addToZone(zid, S.dragWord);
    markPlaced(S.dragWord);
   }
   S.dragWord=null;
  });
  // tap-to-place on touch devices
  dz.addEventListener('click',e=>{
   if(!isTouchDev()) return;
   if(S.selTile===null || !S.dragWord) return;
   e.stopPropagation();
   const zid=dz.dataset.zone;
   const lvObj=LEVELS.find(l=>l.level===S.level||l.id==='random'&&S.level===99);
   if(!lvObj) return;
   const zone=lvObj.zones.find(z=>z.id===zid);
   if(!zone) return;
   if(!zone.multi && S.placements[zid].length>0) return;
   if(!S.placements[zid].includes(S.dragWord)){
    S.placements[zid].push(S.dragWord);
    addToZone(zid, S.dragWord);
    markPlaced(S.dragWord);
   }
   // deselect tile
   document.querySelectorAll('.tile').forEach(x=>x.classList.remove('selected','lit'));
   S.selTile=null; S.dragWord=null; S.dragIdx=null;
  });
 });
}

function addToZone(zid, word){
 const dz=$(`dz-${zid}`); if(!dz) return;
 const ph=$(`dz-ph-${zid}`); if(ph) ph.style.display='none';
 dz.classList.add('has');
 const dt=document.createElement('div');
 dt.className='dtile'; dt.dataset.word=word; dt.dataset.zone=zid;
 dt.innerHTML=`${word}<span class="rm" onclick="removeFromZone('${zid}','${word}',this)">✕</span>`;
 dz.appendChild(dt);
}

function removeFromZone(zid, word, el){
 S.placements[zid] = S.placements[zid].filter(w=>w!==word);
 el.parentElement.remove();
 unmarkPlaced(word);
 const dz=$(`dz-${zid}`);
 if(!dz.querySelector('.dtile')){
  dz.classList.remove('has','ok','bad');
  const ph=$(`dz-ph-${zid}`); if(ph) ph.style.display='';
 }
}

function resetZones(){
 S.placements={};
 document.querySelectorAll('.tile').forEach(t=>t.classList.remove('placed'));
 const lv=LEVELS.find(l=>l.level===S.level);
 renderWorkspace(lv);
 const fb=$('ws-fb'); if(fb){fb.className='ws-fb';fb.textContent=''}
 const db=$('done-banner'); if(db){db.className='done-banner'}
}

function revealZones(){
 const lv=LEVELS.find(l=>l.level===S.level);
 resetZones();
 lv.zones.forEach(zone=>{
  S.placements[zone.id] = [...zone.expected];
  zone.expected.forEach(w=>{addToZone(zone.id,w);markPlaced(w)});
  const dz=$(`dz-${zone.id}`);
  if(dz) dz.classList.add('ok');
 });
 const fb=$('ws-fb');
 fb.className='ws-fb ok on';
 fb.textContent='Answer key revealed! Study the correct placement, then try another level.';
}

function checkZones(){
 const lv=LEVELS.find(l=>l.level===S.level);
 let correct=0; let total=lv.zones.length;
 lv.zones.forEach(zone=>{
  const placed=(S.placements[zone.id]||[]).map(w=>w.toLowerCase());
  const exp=zone.expected.map(w=>w.toLowerCase());
  const ok = exp.every(e=>placed.includes(e)) && placed.every(p=>exp.includes(p));
  const dz=$(`dz-${zone.id}`);
  if(dz){dz.classList.remove('ok','bad');dz.classList.add(ok?'ok':'bad');}

// ==========================  GENERATOR HELPERS  ==========================
function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}
function pickN(arr,n){
 const a=[...arr].filter(x=>x!=null);
 const out=[];
 for(let i=0;i<n&&a.length>0;i++){
  const j=Math.floor(Math.random()*a.length);
  out.push(a.splice(j,1)[0]);
 }
 return out;
}
function shuffle(arr){
 const a=[...arr];
 for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 return a;
}
function makeQ(q,correct,wrongs,hint){
 const unique=[...new Set(wrongs)].filter(w=>w!==correct&&w!=null);
 const fallbacks=['Noun','Verb','Adjective','Adverb','Preposition','Conjunction'].filter(f=>f!==correct&&!unique.includes(f));
 while(unique.length<3) unique.push(fallbacks.shift()||'none of the above');
 const opts=shuffle([correct,unique[0],unique[1],unique[2]]);
 return{q,opts,ans:opts.indexOf(correct),hint};
}

const GENERATORS=[null,gen1,gen2,gen3,gen4,gen5,gen6,gen7];

function generateRandom(){
 const n=parseInt($('gen-level').value)||1;
 const diff=$('gen-diff').value||'Beginner';
 const fn=GENERATORS[n]||gen1;
 const sentObj=fn(diff);
 loadCustomLevel(sentObj);
 const badge=$('gen-badge'); if(badge) badge.style.display='';
}

function loadCustomLevel(sentObj){
 const idx=LEVELS.findIndex(l=>l.id==='random');
